name: Cached Go toolchain
description: Restore fresh compiled packages without racing to save partial caches.
inputs:
  flavor:
    description: Compiler cache family
    default: race
  save:
    description: Only one job per family saves the cache
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/cache/restore@v4
      if: inputs.save != 'true'
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-v2-${{ inputs.flavor }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-v2-${{ inputs.flavor }}-${{ hashFiles('go.mod', 'go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-v2-${{ inputs.flavor }}-
          ${{ runner.os }}-go-release-v1-
    - uses: actions/cache@v4
      if: inputs.save == 'true'
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-v2-${{ inputs.flavor }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-v2-${{ inputs.flavor }}-${{ hashFiles('go.mod', 'go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-v2-${{ inputs.flavor }}-
          ${{ runner.os }}-go-release-v1-
