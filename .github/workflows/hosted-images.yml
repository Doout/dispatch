name: Hosted images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: >-
      github.repository == 'Doout/dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Doout/dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: source
        name: Verify successful CI for the current main commit
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/hosted-image-source.cjs')({ github, context, core });

  publish:
    needs: source
    if: needs.source.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dispatch-platform-main
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PLATFORM_IMAGE: ghcr.io/doout/dispatch-platform
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing commit image
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$PLATFORM_IMAGE:sha-$SOURCE_SHA" --format '{{json .Manifest}}' > manifest.json 2> manifest-error.txt; then
            digest=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' manifest.json)
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown|name_unknown' manifest-error.txt; then
            echo 'digest=' >> "$GITHUB_OUTPUT"
          else
            cat manifest-error.txt >&2
            exit 1
          fi
      - name: Build and publish the commit image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.hosted
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: DISPATCH_VERSION=main-${{ needs.source.outputs.sha }}
          tags: ghcr.io/doout/dispatch-platform:sha-${{ needs.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            org.opencontainers.image.version=main-${{ needs.source.outputs.sha }}
          cache-from: type=gha,scope=dispatch-platform-main
          cache-to: type=gha,mode=max,scope=dispatch-platform-main
      - name: Check both architectures
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: node scripts/check-hosted-image.cjs
      - name: Recheck main before updating its tag
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/hosted-image-source.cjs')({ github, context, core });
      - name: Update the main image
        if: steps.current.outputs.eligible == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$PLATFORM_IMAGE:main" "$PLATFORM_IMAGE@$IMAGE_DIGEST"
      - name: Record published references
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          MAIN_UPDATED: ${{ steps.current.outputs.eligible }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Commit: `%s`\n\nImage: `%s:sha-%s`\n\nPinned image: `%s@%s`\n\nMain updated: `%s`\n' \
            "$SOURCE_SHA" "$PLATFORM_IMAGE" "$SOURCE_SHA" "$PLATFORM_IMAGE" "$IMAGE_DIGEST" "$MAIN_UPDATED" >> "$GITHUB_STEP_SUMMARY"
