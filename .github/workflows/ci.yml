name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dispatch_test
          POSTGRES_PASSWORD: dispatch_test_password
          POSTGRES_DB: dispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch_test -d dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DISPATCH_STORE_POSTGRES_URL: postgres://dispatch_test:dispatch_test_password@127.0.0.1:5432/dispatch_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Exercise isolated PostgreSQL persistence fixtures
        shell: bash
        run: |
          set -o pipefail
          {
            go test -race -count=1 -timeout 8m -json ./internal/store -run '(?i)postgres|^Test(StorageInventoryPersistenceAndProtection|DeploymentCatalog|DeploymentCatalogPostgres|ApplicationHistory).*$'
            go test -race -count=1 -timeout 8m -json ./internal/tenancy
          } | python3 scripts/check-test-results.py --require-name postgres
  docker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISPATCH_RUNTIME_INTEGRATION: '1'
      DISPATCH_ROUTING_DOCKER_INTEGRATION: '1'
      DISPATCH_PROVIDER_CONTAINER_INTEGRATION: '1'
      DISPATCH_OFFSITE_DAEMON_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Verify real Docker routing, recovery and automation journeys
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 8m -json ./internal/deploy ./internal/agentruntime ./internal/api \
            -run '^(TestManagedDockerTraefikPromotionAndRestartIntegration|TestWorkloadBackupPostgresIsolatedVerificationAndRestoreIntegration|TestRemoteManagedRouteCandidateIntegration|TestWorkloadBackupAgentRestartAndIsolatedVerificationIntegration|TestTemporaryEnvironmentDockerRestartExpiryIntegration|TestPackagedMockProviderCLIAndMCPAcceptanceIntegration|TestWorkloadBackupSeparateDaemonsSourceLossIntegration)$' \
            | python3 scripts/check-test-results.py \
              --require-test TestManagedDockerTraefikPromotionAndRestartIntegration \
              --require-test TestWorkloadBackupPostgresIsolatedVerificationAndRestoreIntegration \
              --require-test TestRemoteManagedRouteCandidateIntegration \
              --require-test TestWorkloadBackupAgentRestartAndIsolatedVerificationIntegration \
              --require-test TestTemporaryEnvironmentDockerRestartExpiryIntegration \
              --require-test TestPackagedMockProviderCLIAndMCPAcceptanceIntegration \
              --require-test TestWorkloadBackupSeparateDaemonsSourceLossIntegration
  installation-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Build the controller for a disposable installation
        run: docker build -f Containerfile --target controller -t dispatch-installation:test .
      - name: Verify a complete export and import between Docker installations
        env:
          DISPATCH_INSTALLATION_DOCKER_IMAGE: dispatch-installation:test
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 8m -json ./internal/installation \
            -run '^(TestPortableDockerInstallation|TestComposeDockerInstallationExport)$' \
            | python3 scripts/check-test-results.py \
              --require-test TestPortableDockerInstallation \
              --require-test TestComposeDockerInstallationExport
  hosted-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Build isolated worker image
        run: docker build -f Containerfile.worker -t dispatch-worker:test .
      - name: Verify sandbox execution and cancellation
        shell: bash
        run: |
          set -o pipefail
          export DISPATCH_WORKER_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' dispatch-worker:test)
          go test -race -count=1 -timeout 8m -json ./internal/workflowrunner -run 'TestDisposable.*Integration' \
            | python3 scripts/check-test-results.py \
              --require-test TestDisposableManagedWorkerIntegration \
              --require-test TestDisposableWorkerCancellationIntegration
  api-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Run discovered API race tests
        run: python3 scripts/test-api-shard.py --shard ${{ matrix.shard }} --count 8
      - name: Preserve API discovery, coverage and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-race-${{ matrix.shard }}
          path: api-race-results/
          if-no-files-found: error
          overwrite: true
  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          save: ${{ matrix.shard == 0 }}
      - name: Run all other discovered Go race tests
        run: python3 scripts/test-go-shard.py --shard ${{ matrix.shard }} --count 6
      - name: Preserve Go discovery, coverage and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-race-${{ matrix.shard }}
          path: go-race-results/
          if-no-files-found: error
          overwrite: true
  api-coverage:
    needs: [api-race, go-race]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful race matrices
        env:
          RACE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RACE_RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: api-race-*
          path: api-race-results/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: go-race-*
          path: go-race-results/
          merge-multiple: true
      - name: Verify complete race coverage
        run: |
          python3 scripts/test-api-shard.py --verify api-race-results --count 8
          python3 scripts/test-go-shard.py --verify go-race-results --count 6
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web audit --prod --audit-level high
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test --maxWorkers=2
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/ui/dist/
          if-no-files-found: error
          overwrite: true
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  build-checks:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install controller native toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: ./.github/actions/setup-go
        with:
          flavor: release
          save: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/ui/dist/
      - name: Check discovered Go shard coverage and selection semantics
        run: |
          python3 scripts/test-api-shard_test.py
          python3 scripts/test-go-shard_test.py
      - name: Check required CI status dependencies
        run: python3 scripts/check-ci-gate_test.py
      - name: Check image and release publication guards
        run: |
          node scripts/check-hosted-images_test.cjs
          node scripts/check-release-source_test.cjs
      - run: sh scripts/install_test.sh
      - name: Build release binaries and prime the compiler cache
        run: sh scripts/build-release.sh development
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=dispatch-runtime
          cache-to: type=gha,mode=max,scope=dispatch-runtime
          tags: dispatch:test
  test:
    needs: [build-checks, api-coverage, hosted-workers, postgres, docker-lifecycle, installation-portability, frontend, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = {name: job['result'] for name, job in json.loads(os.environ['JOB_RESULTS']).items()}
          failed = {name: result for name, result in results.items() if result != 'success'}
          if failed:
              print(f'Required CI jobs did not succeed: {failed}')
              sys.exit(1)
          print('Every required validation job succeeded.')
          PYTHON
