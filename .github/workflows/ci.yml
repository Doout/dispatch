name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dispatch_test
          POSTGRES_PASSWORD: dispatch_test_password
          POSTGRES_DB: dispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch_test -d dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DISPATCH_STORE_POSTGRES_URL: postgres://dispatch_test:dispatch_test_password@127.0.0.1:5432/dispatch_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Exercise isolated PostgreSQL persistence fixtures
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 40m -json ./internal/store | python3 scripts/check-test-results.py --require-name postgres
  docker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DISPATCH_RUNTIME_INTEGRATION: '1'
      DISPATCH_ROUTING_DOCKER_INTEGRATION: '1'
      DISPATCH_PROVIDER_CONTAINER_INTEGRATION: '1'
      DISPATCH_OFFSITE_DAEMON_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify real Docker routing, recovery and automation journeys
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 20m -json ./internal/deploy ./internal/agentruntime ./internal/api \
            -run '^(TestManagedDockerTraefikPromotionAndRestartIntegration|TestWorkloadBackupPostgresIsolatedVerificationAndRestoreIntegration|TestRemoteManagedRouteCandidateIntegration|TestWorkloadBackupAgentRestartAndIsolatedVerificationIntegration|TestTemporaryEnvironmentDockerRestartExpiryIntegration|TestPackagedMockProviderCLIAndMCPAcceptanceIntegration|TestWorkloadBackupSeparateDaemonsSourceLossIntegration)$' \
            | python3 scripts/check-test-results.py \
              --require-test TestManagedDockerTraefikPromotionAndRestartIntegration \
              --require-test TestWorkloadBackupPostgresIsolatedVerificationAndRestoreIntegration \
              --require-test TestRemoteManagedRouteCandidateIntegration \
              --require-test TestWorkloadBackupAgentRestartAndIsolatedVerificationIntegration \
              --require-test TestTemporaryEnvironmentDockerRestartExpiryIntegration \
              --require-test TestPackagedMockProviderCLIAndMCPAcceptanceIntegration \
              --require-test TestWorkloadBackupSeparateDaemonsSourceLossIntegration
  api-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run discovered API race tests
        run: python3 scripts/test-api-shard.py --shard ${{ matrix.shard }} --count 4
      - name: Preserve API discovery, coverage and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-race-${{ matrix.shard }}
          path: api-race-results/
          if-no-files-found: error
  api-coverage:
    needs: api-race
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: api-race-*
          path: api-race-results/
          merge-multiple: true
      - name: Verify complete API coverage and report shard timings
        run: python3 scripts/test-api-shard.py --verify api-race-results --count 4
  build-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install controller native toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules and compiled packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-go-release-v1-
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web audit --prod --audit-level high
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test --maxWorkers=2
      - run: pnpm --dir web build
      - name: Check deterministic API shard coverage and Go selection semantics
        run: python3 scripts/test-api-shard_test.py
      - name: Check required CI status dependencies
        run: python3 scripts/check-ci-gate_test.py
      - name: Run the full race suite for all other discovered Go packages
        run: python3 scripts/test-api-shard.py --other-packages
      - run: sh scripts/install_test.sh
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build release binaries and prime the compiler cache
        run: sh scripts/build-release.sh development
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=dispatch-runtime
          cache-to: type=gha,mode=max,scope=dispatch-runtime
          tags: dispatch:test
  test:
    needs: [build-checks, api-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build checks and complete API race coverage
        env:
          BUILD_CHECKS_RESULT: ${{ needs.build-checks.result }}
          API_COVERAGE_RESULT: ${{ needs.api-coverage.result }}
        run: |
          if [[ "$BUILD_CHECKS_RESULT" != success || "$API_COVERAGE_RESULT" != success ]]; then
            echo "Required jobs did not both succeed: build-checks=$BUILD_CHECKS_RESULT api-coverage=$API_COVERAGE_RESULT"
            exit 1
          fi
