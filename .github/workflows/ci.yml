name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules and compiled packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-go-release-v1-
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web audit --prod --audit-level high
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test --maxWorkers=2
      - run: pnpm --dir web build
      - run: go test -race ./...
      - run: sh scripts/install_test.sh
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build release binaries and prime the compiler cache
        run: sh scripts/build-release.sh development
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=dispatch-runtime
          cache-to: type=gha,mode=max,scope=dispatch-runtime
          tags: dispatch:test
