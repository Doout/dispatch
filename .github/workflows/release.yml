name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: dispatch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test --maxWorkers=2
      - run: pnpm --dir web build
      - run: go test -race -p 2 ./...
      - run: sh scripts/install_test.sh
      - run: go vet ./...
      - name: Build CLI archives
        shell: bash
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            mkdir -p "release/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X github.com/doout/dispatch/internal/installation.Version=$GITHUB_REF_NAME" -o "release/$arch/dispatch" ./cmd/dispatch
            tar -czf "release/dispatch-linux-$arch.tar.gz" -C "release/$arch" dispatch
          done
          cd release
          sha256sum dispatch-linux-*.tar.gz > SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: DISPATCH_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/doout/dispatch:${{ github.ref_name }}
            ghcr.io/doout/dispatch:stable
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish CLI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/dispatch-linux-*.tar.gz release/SHA256SUMS --verify-tag --generate-notes --title "Dispatch $GITHUB_REF_NAME"
