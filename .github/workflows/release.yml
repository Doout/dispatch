name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: dispatch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules and compiled packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-go-release-v1-
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test --maxWorkers=2
      - run: pnpm --dir web build
      - run: go test -race -p 2 ./...
      - run: sh scripts/install_test.sh
      - run: go vet ./...
      - name: Build release binaries once
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=dispatch-runtime
          cache-to: type=gha,mode=max,scope=dispatch-runtime
          tags: |
            ghcr.io/doout/dispatch:${{ github.ref_name }}
            ghcr.io/doout/dispatch:stable
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish CLI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/dispatch-linux-*.tar.gz release/SHA256SUMS --verify-tag --generate-notes --title "Dispatch $GITHUB_REF_NAME"
