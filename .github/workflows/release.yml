name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: dispatch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
      - name: Install controller native toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules and compiled packages
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-release-v1-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-go-release-v1-
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web audit --prod --audit-level high
      - run: pnpm --dir web test --maxWorkers=2
      - run: pnpm --dir web build
      - run: go test -race -p 2 -timeout 40m ./...
      - run: sh scripts/install_test.sh
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build release binaries once
        run: |
          sh scripts/build-release.sh "$GITHUB_REF_NAME"
          python3 scripts/check-release.py release
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish controller image
        id: controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=dispatch-runtime
          cache-to: type=gha,mode=max,scope=dispatch-runtime
          tags: |
            ghcr.io/doout/dispatch:${{ github.ref_name }}
            ghcr.io/doout/dispatch:stable
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish dispatch-platform image
        id: hosted
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.hosted
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=dispatch-platform-runtime
          cache-to: type=gha,mode=max,scope=dispatch-platform-runtime
          tags: ghcr.io/doout/dispatch-platform:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish dispatch-dns image
        id: dns
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.dns
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=dispatch-dns-runtime
          cache-to: type=gha,mode=max,scope=dispatch-dns-runtime
          tags: ghcr.io/doout/dispatch-dns:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish dispatch-worker image
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.worker
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=dispatch-worker-runtime
          cache-to: type=gha,mode=max,scope=dispatch-worker-runtime
          tags: ghcr.io/doout/dispatch-worker:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Record immutable image references
        env:
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.hosted.outputs.digest }}
          DNS_DIGEST: ${{ steps.dns.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          for digest in "$CONTROLLER_DIGEST" "$PLATFORM_DIGEST" "$DNS_DIGEST" "$WORKER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Missing image digest'; exit 1; }
          done
          printf 'ghcr.io/doout/dispatch:%s@%s\nghcr.io/doout/dispatch-platform:%s@%s\nghcr.io/doout/dispatch-dns:%s@%s\nghcr.io/doout/dispatch-worker:%s@%s\n' \
            "$GITHUB_REF_NAME" "$CONTROLLER_DIGEST" "$GITHUB_REF_NAME" "$PLATFORM_DIGEST" \
            "$GITHUB_REF_NAME" "$DNS_DIGEST" "$GITHUB_REF_NAME" "$WORKER_DIGEST" > release/images.txt
          (cd release && sha256sum images.txt >> SHA256SUMS)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/dispatch-linux-*.tar.gz release/dispatch-platform-linux-*.tar.gz release/dispatch-hosted-config.tar.gz release/images.txt release/SHA256SUMS --verify-tag --generate-notes --title "Dispatch $GITHUB_REF_NAME"
