name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: dispatch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
      - id: revision
        name: Resolve the release commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: source
        name: Require successful CI for the exact release commit
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
        with:
          script: |
            await require('./scripts/release-source.cjs')({ github, context, core });
      - name: Install controller native toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: ./.github/actions/setup-go
        with:
          flavor: release
      - name: Reuse the frontend built and tested by main CI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/ui/dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run-id }}
      - name: Build release binaries once
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=dispatch-runtime
          cache-to: type=gha,mode=max,scope=dispatch-runtime
          tags: |
            ghcr.io/doout/dispatch:${{ github.ref_name }}
            ghcr.io/doout/dispatch:stable
          labels: |
            org.opencontainers.image.source=https://github.com/Doout/dispatch
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish CLI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/dispatch-linux-*.tar.gz release/dispatch-platform-linux-*.tar.gz release/SHA256SUMS --verify-tag --generate-notes --title "Dispatch $GITHUB_REF_NAME"
