openapi: 3.1.0
info:
  title: Dispatch controller API
  version: 0.1.0
  description: Project-scoped application deployment and operations API.
servers:
  - url: /api/v1
security:
  - basicAuth: []
  - bearerAuth: []
paths:
  /analytics:
    get:
      operationId: getAnalytics
      description: >-
        Reads a cached historical summary filtered by current project permissions.
        Current and previous periods are adjacent equal rolling windows ending at
        updatedAt. Daily bins use UTC and can contain partial boundary days.
        Success rates exclude cancellations; duration metrics include successful,
        non-reused runs with valid timing. Median and p95 are histogram estimates.
        Archived counts can include deployments removed from operational history.
      parameters:
      - name: days
        in: query
        schema: { type: integer, enum: [7, 30, 90], default: 30 }
      - name: projectId
        in: query
        description: Optional visible project. An unreadable project returns 403.
        schema: { type: string }
      responses:
        '200':
          description: Permission-filtered summary, including collection state and coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /deployment-catalog:
    get:
      operationId: getDeploymentCatalog
      description: Project-visible application environments and their latest attempts, last successful releases, and
        saved status. No runtime connections are opened.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeploymentCatalogItem'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /deployment-search:
    get:
      operationId: searchDeploymentHistory
      description: Search all retained history within accessible applications; filters apply before cursor pagination.
        Returns at most 50 records without snapshots or credentials.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
                  next:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: project
        in: query
        schema:
          type: string
      - name: application
        in: query
        schema:
          type: string
      - name: environment
        in: query
        schema:
          type: string
      - name: target
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: revision
        in: query
        schema:
          type: string
      - name: before
        in: query
        schema:
          type: string
      - name: completedFrom
        in: query
        description: >-
          Inclusive RFC3339 completion time. Restricts results to terminal runs;
          legacy runs without a finish timestamp use their creation timestamp.
          Must precede completedTo when both are supplied.
        schema: { type: string, format: date-time }
      - name: completedTo
        in: query
        description: Exclusive RFC3339 completion time. Restricts results to terminal runs.
        schema: { type: string, format: date-time }
  /deployments/{id}/identity:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getDeploymentIdentity
      description: Requires project.view. Reads historical target and release metadata from the saved snapshot, with
        current and latest run identities.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCatalogItem'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /deployments/{id}/compare-environment:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: compareEnvironmentInputs
      description: Requires project.view for both deployments in the same project. Compares immutable saved inputs
        across different application environments; credentials and live state are excluded. Limited to 1000 changes.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedDeploymentComparison'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: from
        in: query
        schema:
          type: string
        required: true
  /apps/{id}/observations:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getApplicationObservations
      description: Requires project.view. Read configuration, separate workload and endpoint observations, freshness,
        and delivery history. This read does not contact the target.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    put:
      operationId: configureApplicationObservations
      description: Requires project.configure. Scheduled observations and notifications are opt-in. Revision guards
        concurrent edits; sensitive delivery URLs are write-only. Stale threshold must be at least the interval.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationConfigurationInput'
  /apps/{id}/observations/check:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: checkApplicationObservations
      description: Requires project.configure. Manual bounded workload and HTTP/TLS check from Dispatch controller;
        results are observations of that location only. Active runtime operations return conflict.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /apps/{id}/release-preview:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: previewApplicationRelease
      description: Requires deployment.run and an idle application. Validates selected revision, binding resolution,
        Helm rendering and server-side dry-run where supported. Preview performs no rollout and is not a reservation
        of target state.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePreview'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: string
  /apps/{id}/activity:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getApplicationReleaseActivity
      description: Requires project.view. Retained source/build/approval/deployment/runtime/operator activity with
        sanitized details.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /deployments/{id}/release:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getDeploymentRelease
      description: Requires project.view. Saved release notes, source links, and rollback availability explanation.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/ReleaseNote'
                  sourceLinks:
                    type: array
                    items:
                      type: string
                  rollbackMessage:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateDeploymentRelease
      description: Requires project.configure. Store release notes and HTTPS pull-request/source links. Do not include credentials in notes; links cannot embed user information.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseNote'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 12000
                links:
                  type: array
                  items:
                    type: string
  /deployments/{id}/rollback-preview:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: previewDeploymentRollback
      description: Requires deployment.run. Review a retained successful Helm revision, original values and service
        Secret references, current deployment, and server-side validation before rollback.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /deployments/{id}/rollback:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: rollbackDeploymentRelease
      description: Requires deployment.run. Rechecks the expected current release and creates an audited deployment
        using retained artifacts. Does not undo database migrations or external side effects.
      responses:
        '202':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmDeploymentId
              - expectedCurrentDeploymentId
              - confirmDatabaseNotReverted
              properties:
                confirmDeploymentId:
                  type: string
                expectedCurrentDeploymentId:
                  type: string
                confirmDatabaseNotReverted:
                  type: boolean
                  const: true
  /deployments/{id}/diagnosis:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: diagnoseDeploymentRelease
      description: Requires project.view. Bounded live inspection of failing pods, scheduling/image-pull errors, restarts,
        events, and relevant redacted logs with next steps. Does not mutate workloads.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /audit:
    get:
      operationId: listAuditEvents
      description: Requires authentication. Owners see controller events; members see events only in projects they
        can view. Returns at most 100 events.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: projectId
        in: query
        schema:
          type: string
      - name: appId
        in: query
        schema:
          type: string
      - name: actorId
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: before
        in: query
        schema:
          type: string
  /apps/{id}/owner:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getApplicationOwner
      description: Requires project.view. Responsible person/team metadata and display name. Ownership does not grant
        permissions.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOwner'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    put:
      operationId: setApplicationOwner
      description: Requires project.configure. Record responsible user/team, or clear principalId to remove the label.
        Does not modify access grants.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOwner'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principalType:
                  type: string
                  enum:
                  - user
                  - team
                principalId:
                  type: string
  /projects/{id}/owner-candidates:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listApplicationOwnerCandidates
      description: Requires project.configure. Lists eligible user/team metadata for ownership selection within the
        project.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                  teams:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /identity-team-mappings:
    get:
      operationId: listIdentityTeamMappings
      description: Controller owner only. List mappings from verified GitHub team memberships to Dispatch teams.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityTeamMapping'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    post:
      operationId: saveIdentityTeamMapping
      description: Controller owner only. Membership is refreshed on sign-in using verified provider claims. Manual
        membership remains separate.
      responses:
        '201':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTeamMapping'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTeamMapping'
  /identity-team-mappings/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: deleteIdentityTeamMapping
      description: Controller owner only. Remove the mapping.
      responses:
        '204':
          description: Successful operation.
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /projects/{id}/retention:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getProjectRetention
      description: Requires project.manage. Read an explicit history policy; no automatic cleanup is enabled.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    put:
      operationId: saveProjectRetention
      description: Requires project.manage. Store a retention policy. Cleanup is a separate explicit operation.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicy'
  /projects/{id}/retention/preview:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: previewProjectRetention
      description: Requires project.manage. Count eligible historical logs/runs, preserving current, successful, baseline,
        and workflow dependencies.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /projects/{id}/retention/apply:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: applyProjectRetention
      description: Requires project.manage. Reevaluate eligibility and delete only unprotected data in this project.
        This operation is irreversible.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm
              properties:
                confirm:
                  type: string
                  description: Must equal the project ID.
  /operations/backups:
    get:
      operationId: listControllerBackups
      description: Controller owner only. Metadata and restore-verification outcomes, never backup paths, contents,
        or credentials.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  backups:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupRecord'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createControllerBackup
      description: Controller owner only. Create a consistent controller database and encrypted credential key backup
        in protected controller storage.
      responses:
        '201':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /operations/backups/{id}/verify:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: verifyControllerBackup
      description: Controller owner only. Verify a backup in disposable storage/database. Does not replace the running
        controller.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /services/{id}/impact:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getServiceImpact
      description: Requires project.view. List dependent applications, environments, applied revisions and redeployment
        availability.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceImpact'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /services/{id}/redeploy:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: redeployServiceConsumers
      description: Requires project.configure and deployment.run. Explicitly redeploy selected consumers with the
        last successful source revision and current service inputs. Repository-managed consumers use workflow promotion.
      responses:
        '202':
          description: Successful result.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appId:
                      type: string
                    deployment:
                      $ref: '#/components/schemas/Deployment'
                    error:
                      type: string
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - appIds
              - confirm
              properties:
                revision:
                  type: integer
                appIds:
                  type: array
                  items:
                    type: string
                confirm:
                  type: boolean
                  const: true
  /role-assignments:
    post:
      operationId: saveRoleAssignment
      description: Controller owner only. Create or update a project role; omitted expiry preserves the existing expiry
        and null removes it.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentInput'
  /role-assignments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: deleteRoleAssignment
      description: Controller owner only. Delete a project grant.
      responses:
        '204':
          description: Successful operation.
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /edge/nodes/{id}/enroll:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: enrollEdgeIdentity
      description: Exchange a single-use expiring enrollment bearer token for a node identity and short-lived session.
        Public key is Ed25519 encoded by the edge client. Response is no-store.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeSession'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - publicKey
              properties:
                publicKey:
                  type: string
      security:
      - bearerAuth: []
  /edge/nodes/{id}/challenge:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: challengeEdgeIdentity
      description: Request a short-lived nonce for an enrolled node public key. Signed proof is required at session
        exchange. Bounded outstanding challenges prevent unbounded issuance.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - publicKey
              properties:
                publicKey:
                  type: string
      security: []
  /edge/nodes/{id}/session:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: exchangeEdgeSession
      description: Exchange a single-use signed challenge for a short-lived node session. Signature and generation
        must match the enrolled identity. Response is no-store.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeSession'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge
              - signature
              - generation
              properties:
                challenge:
                  type: string
                signature:
                  type: string
                generation:
                  type: integer
      security: []
  /private-networks/{id}/revoke:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: revokeEdgeIdentity
      description: Controller owner only. Immediately revoke the enrolled node identity and sessions; rotate enrollment
        to reconnect.
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /apps/{id}/deployment-history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getApplicationDeploymentHistory
      description: Saved runs for one application, newest first. Requires project.view. Returns up to 50 items without credential values or snapshot bodies.
      parameters:
        - { name: before, in: query, schema: { type: string }, description: Deployment ID returned as the previous page's next cursor. }
      responses:
        "200":
          description: A page of runs and an optional next cursor.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object } }
                  next: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /deployments/{id}/compare:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: compareDeploymentInputs
      description: Compare saved inputs of two deployments of the same application. Requires project.view. Excludes sensitive fields, chart defaults, and live state. Missing snapshots return available false. At most 1000 changes are returned.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: Earlier deployment ID. }
      responses:
        "200":
          description: Snapshot comparison, including availability and redaction notices.
          content:
            application/json:
              schema:
                type: object
                required: [fromId, toId, available, changes, hidden, truncated, message]
                properties:
                  fromId: { type: string }
                  toId: { type: string }
                  available: { type: boolean }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [path, kind, before, after]
                      properties:
                        path: { type: string }
                        kind: { type: string, enum: [added, removed, changed] }
                        before: {}
                        after: {}
                  hidden: { type: integer }
                  truncated: { type: boolean }
                  message: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /apps/{id}/sync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getApplicationSync
      description: Saved runtime observation, repository sync, deployment revision, and recent reapply history. Requires project.view.
      responses:
        "200":
          description: Separate sync, drift, and health indicators. Does not contact the target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationSync" }
        "403": { $ref: "#/components/responses/Problem" }
  /apps/{id}/drift/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkApplicationDrift
      description: Manual controller-side Kubernetes/OpenShift check with a 30-second deadline. Requires project.configure.
      responses:
        "200":
          description: Saved observation. Target failures produce Unknown and preserve the last successful check time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationSync" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /apps/{id}/reapply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: reapplyApplication
      description: Explicitly restore the saved successful deployment after dry-run validation. Requires deployment.run. Does not adopt new Git revisions or credentials. Multi-resource writes are not transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deploymentId]
              properties:
                deploymentId: { type: string, minLength: 1 }
      responses:
        "200":
          description: Reapply recorded and runtime checked again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationSync" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /services:
    get:
      operationId: listServices
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Services in visible projects, including consumers and last manual check.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Service" } }
    post:
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201": { description: Connection registered. No external resource is provisioned. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /services/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getService
      responses:
        "200":
          description: Connection metadata. Sensitive values are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    put:
      operationId: updateService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200": { description: Updated. Connection edits increment revision and clear the check result. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteService
      responses:
        "204": { description: Registration removed. The external dependency is untouched. }
        "409": { $ref: "#/components/responses/Problem" }
  /services/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: verifyService
      responses:
        "200":
          description: Manual controller-side check result, including failures. Maximum duration ten seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCheck" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /apps/{id}/service-bindings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getApplicationServiceBindings
      responses:
        "200":
          description: Configured service bindings without credentials.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceBinding" } }
    put:
      operationId: replaceApplicationServiceBindings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: "#/components/schemas/ServiceBinding" } }
      responses:
        "200": { description: Bindings replaced. Does not redeploy the application. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: Repository-managed bindings must be edited in YAML. }
  /auth/status:
    get:
      operationId: getAuthenticationStatus
      security: []
      responses:
        "200":
          description: Whether first-run administrator setup is required.
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired, tokenLoginAvailable]
                properties:
                  setupRequired: { type: boolean }
                  tokenLoginAvailable: { type: boolean }
  /auth/setup:
    post:
      operationId: setupAdministrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 12, maxLength: 72 }
      responses:
        "201": { description: First administrator created. }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Browser session created.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Current inventory and recent deployment evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /secrets:
    get:
      operationId: listSecrets
      description: Lists write-only secret metadata. Values are never returned.
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
    post:
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, environmentVariable]
              properties:
                name: { type: string, maxLength: 80 }
                type: { type: string, enum: [text, api_token, github_token, ssh_private_key, registry_password], default: text }
                source: { type: string, enum: [local, external], default: local }
                environmentVariable: { type: string, maxLength: 128 }
                value: { type: string, maxLength: 65536, writeOnly: true }
                generate: { type: boolean, description: Generates an Ed25519 key when type is ssh_private_key. The private key is never returned. }
                externalStoreId: { type: string, description: Required when source is external. }
                externalSecretId: { type: string, maxLength: 2048, description: Provider secret ID. Required when source is external. }
                externalField: { type: string, maxLength: 256, description: Optional dot-separated field selected from a structured provider value. }
      responses:
        "201": { description: Encrypted secret created; only metadata is returned. }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /secrets/{secretId}:
    parameters:
      - name: secretId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateSecret
      description: Updates metadata and optionally rotates the write-only value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, environmentVariable]
              properties:
                name: { type: string, maxLength: 80 }
                type: { type: string, enum: [text, api_token, github_token, ssh_private_key, registry_password] }
                source: { type: string, enum: [local, external] }
                environmentVariable: { type: string, maxLength: 128 }
                value: { type: string, maxLength: 65536, writeOnly: true, description: Omit to retain the current value. }
                generate: { type: boolean, description: Rotates an ssh_private_key with a newly generated Ed25519 key. }
                externalStoreId: { type: string }
                externalSecretId: { type: string, maxLength: 2048 }
                externalField: { type: string, maxLength: 256 }
      responses:
        "200": { description: Secret metadata updated. }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSecret
      responses:
        "204": { description: Secret and future event-rule bindings deleted. }
        "404": { $ref: "#/components/responses/Problem" }
  /secret-stores:
    get:
      operationId: listSecretStores
      description: Lists external secret manager connections without provider credentials.
      responses:
        "200":
          description: External secret stores.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SecretStore" } }
    post:
      operationId: createSecretStore
      description: Verifies and stores an encrypted external secret manager connection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretStoreInput" }
      responses:
        "201": { description: Secret store connected. }
        "400": { $ref: "#/components/responses/Problem" }
  /secret-stores/{secretStoreId}:
    parameters:
      - { in: path, name: secretStoreId, required: true, schema: { type: string } }
    put:
      operationId: updateSecretStore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretStoreInput" }
      responses:
        "200": { description: Secret store updated. }
    delete:
      operationId: deleteSecretStore
      responses:
        "204": { description: Unused secret store deleted. }
        "409": { $ref: "#/components/responses/Problem" }
  /secret-stores/{secretStoreId}/verify:
    parameters:
      - { in: path, name: secretStoreId, required: true, schema: { type: string } }
    post:
      operationId: verifySecretStore
      responses:
        "200": { description: Provider authentication and access verified. }
        "502": { $ref: "#/components/responses/Problem" }
  /private-networks:
    get:
      operationId: listEdgeNodes
      responses:
        "200":
          description: Edge nodes, managed Laneway Connectors, and legacy Laneway routes.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EdgeNode" } }
    post:
      operationId: createPrivateNetwork
      description: Creates an edge node or Laneway connection. Edge credentials are returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                driver: { type: string, enum: [dispatch_agent, laneway_connector, laneway], default: dispatch_agent }
                socketPath: { type: string, description: Used only by a legacy Laneway route. }
                authority: { type: string, format: uri, description: Laneway control-plane HTTPS origin used by a managed Connector. }
                route: { type: string, description: Private Dispatch IP or CIDR published through the managed Connector. }
      responses:
        "201": { description: Private network connection created. }
  /private-networks/{edgeNodeId}/install-connector:
    parameters:
      - { in: path, name: edgeNodeId, required: true, schema: { type: string } }
    post:
      operationId: installLanewayConnector
      description: Consumes a one-time Laneway Connector bootstrap and deploys the Connector through the controller Docker socket. The command is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bootstrapCommand]
              properties:
                bootstrapCommand: { type: string, writeOnly: true, maxLength: 4096 }
      responses:
        "200": { description: Connector started. }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /private-networks/{edgeNodeId}/rotate-token:
    parameters:
      - { in: path, name: edgeNodeId, required: true, schema: { type: string } }
    post:
      operationId: rotateEdgeNodeToken
      description: Invalidates the prior edge credential and returns a replacement token once.
      responses:
        "200": { description: Edge node token rotated. }
  /laneway-networks/authorize:
    post:
      operationId: startLanewayNetworkAuthorization
      description: Registers or reuses a generic Laneway application, then starts authorization for one network installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, authority]
              properties:
                name: { type: string, maxLength: 80 }
                authority: { type: string, format: uri, description: Laneway HTTPS origin. }
      responses:
        "200":
          description: Browser handoff for application registration or network authorization.
          content:
            application/json:
              schema:
                type: object
                required: [method, action]
                properties:
                  method: { type: string, enum: [post, redirect] }
                  action: { type: string, format: uri }
                  fields:
                    type: object
                    additionalProperties: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /laneway-applications/setup:
    get:
      operationId: completeLanewayApplicationRegistration
      description: Exchanges a generic Laneway application registration code, then starts network authorization.
      security: []
      parameters:
        - { in: query, name: code, required: false, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: error, required: false, schema: { type: string } }
        - { in: query, name: error_description, required: false, schema: { type: string } }
      responses:
        "303": { description: Opens Laneway network authorization or returns to Connections with an error. }
  /laneway-networks/callback:
    get:
      operationId: completeLanewayNetworkAuthorization
      security: []
      parameters:
        - { in: query, name: code, required: false, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: error, required: false, schema: { type: string } }
        - { in: query, name: error_description, required: false, schema: { type: string } }
      responses:
        "303": { description: Returns to Connections with the authorization result. }
  /laneway-networks/{privateNetworkId}/inventory:
    parameters:
      - { in: path, name: privateNetworkId, required: true, schema: { type: string } }
    get:
      operationId: getLanewayNetworkInventory
      responses:
        "200":
          description: Current network, node, endpoint, and route inventory from Laneway.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanewayInventory" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /laneway-networks/{privateNetworkId}/node-installers:
    parameters:
      - { in: path, name: privateNetworkId, required: true, schema: { type: string } }
    post:
      operationId: createLanewayNodeInstaller
      description: Creates a short-lived, one-time installer for a node in the connected Laneway network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, installMode]
              properties:
                name: { type: string, maxLength: 253 }
                kind: { type: string, enum: [node, connector, exit] }
                installMode: { type: string, enum: [docker_compose, systemd] }
      responses:
        "201":
          description: Installer command. Dispatch does not store this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanewayNodeInstaller" }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /laneway-networks/{privateNetworkId}/routes:
    parameters:
      - { in: path, name: privateNetworkId, required: true, schema: { type: string } }
    post:
      operationId: createLanewayRoute
      description: Assigns a network prefix to a node in the connected Laneway network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId, prefix, mode]
              properties:
                nodeId: { type: string }
                prefix: { type: string }
                mode: { type: string, enum: [nat, routed] }
                metric: { type: integer, minimum: 0, maximum: 1000000, default: 100 }
      responses:
        "201":
          description: Route assigned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanewayRoute" }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /github-apps:
    get:
      operationId: listGitHubApps
      description: Lists GitHub App registrations without returning private keys or webhook secrets.
      responses:
        "200":
          description: Configured GitHub App connections.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GitHubAppConnection" } }
    post:
      operationId: createGitHubApp
      description: Connects an existing GitHub.com or GitHub Enterprise Server App.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubAppInput" }
      responses:
        "201": { description: GitHub App credentials encrypted and connection created. }
        "400": { $ref: "#/components/responses/Problem" }
  /github-apps/{githubAppId}:
    parameters:
      - $ref: "#/components/parameters/GitHubAppID"
    put:
      operationId: updateGitHubApp
      description: Updates registration metadata, installation, or both write-only credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubAppUpdateInput"
      responses:
        "200": { description: GitHub App connection updated. }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteGitHubApp
      description: Removes encrypted credentials from Dispatch only. The GitHub-owned App registration is not deleted.
      responses:
        "204": { description: Unused GitHub App connection deleted. }
        "409": { $ref: "#/components/responses/Problem" }
  /github-apps/{githubAppId}/verify:
    parameters:
      - $ref: "#/components/parameters/GitHubAppID"
    post:
      operationId: verifyGitHubApp
      description: Verifies the private key, installation, and installation repository access.
      responses:
        "200": { description: Registration and installation verified. }
        "422": { $ref: "#/components/responses/Problem" }
  /github-apps/{githubAppId}/installations:
    parameters:
      - $ref: "#/components/parameters/GitHubAppID"
    get:
      operationId: listGitHubAppInstallations
      description: Lists installations visible to the configured App private key.
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /github-apps/{githubAppId}/repositories:
    parameters:
      - $ref: "#/components/parameters/GitHubAppID"
    get:
      operationId: listGitHubAppRepositories
      description: Lists repositories selected for the GitHub App installation. The App webhook covers this repository set.
      responses:
        "200":
          description: Repositories accessible to the installation token.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GitHubRepository" } }
        "422": { $ref: "#/components/responses/Problem" }
  /github-apps/manifest:
    post:
      operationId: startGitHubAppManifest
      description: Creates a one-hour registration request and returns the GitHub manifest form action and payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, webUrl, ownerType]
              properties:
                name: { type: string, maxLength: 34, description: Must be unique on the selected GitHub host. }
                webUrl: { type: string, format: uri, example: "https://github.example.com" }
                apiUrl: { type: string, format: uri, description: Derived as /api/v3 for Enterprise Server when omitted. }
                ownerType: { type: string, enum: [personal, organization], description: Selects the GitHub settings account that owns the registration. }
                owner: { type: string, description: Organization login. Required when ownerType is organization. }
      responses:
        "200": { description: GitHub App manifest form action and manifest payload. }
  /github-apps/manifest/callback:
    get:
      operationId: completeGitHubAppManifest
      security: []
      description: One-time GitHub manifest callback that exchanges the code and stores encrypted App credentials.
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "303": { description: Redirects to the Connections page for installation. }
  /config-sources:
    get:
      operationId: listConfigSources
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
    post:
      operationId: createConfigSource
      description: Imports strict Dispatch YAML or JSON from a GitHub repository and configures its update mode.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigSourceInput" }
      responses:
        "201": { description: Configuration source created and its first sync attempted. }
        "400": { $ref: "#/components/responses/Problem" }
  /config-sources/{configSourceId}:
    parameters:
      - { in: path, name: configSourceId, required: true, schema: { type: string } }
    put:
      operationId: updateConfigSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigSourceInput" }
      responses:
        "200": { description: Configuration source updated and synced. }
    delete:
      operationId: deleteConfigSource
      responses:
        "204": { description: Configuration source and imported resources deleted. }
  /config-sources/{configSourceId}/sync:
    parameters:
      - { in: path, name: configSourceId, required: true, schema: { type: string } }
    post:
      operationId: syncConfigSource
      responses:
        "200": { description: Configuration synced. }
        "422": { $ref: "#/components/responses/Problem" }
  /workflow/resources:
    get:
      operationId: listWorkflowResources
      parameters:
        - { in: query, name: configSourceId, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /workflow/resources/{resourceId}/topology:
    get:
      operationId: getWorkflowTopology
      parameters:
        - { in: path, name: resourceId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Parsed workflow relationships.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTopology" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /workflow/resources/{resourceId}/activate:
    post:
      operationId: activateWorkflowResource
      parameters:
        - { in: path, name: resourceId, required: true, schema: { type: string } }
      responses:
        "202": { description: Resource activated. Applications also queue their first revision. }
  /workflow/resources/{resourceId}/deactivate:
    post:
      operationId: deactivateWorkflowResource
      parameters:
        - { in: path, name: resourceId, required: true, schema: { type: string } }
      responses:
        "200": { description: Resource paused. }
  /workflow/resources/{resourceId}/runs:
    post:
      operationId: runWorkflowResource
      parameters:
        - { in: path, name: resourceId, required: true, schema: { type: string } }
      responses:
        "202": { description: Application revision queued. }
  /workflow/revisions:
    get:
      operationId: listWorkflowRevisions
      parameters:
        - { in: query, name: resourceId, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /workflow/revisions/{revisionId}/jobs:
    get:
      operationId: listWorkflowJobs
      parameters:
        - { in: path, name: revisionId, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /workflow/revisions/{revisionId}/stages:
    get:
      operationId: listWorkflowStages
      parameters:
        - { in: path, name: revisionId, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /workflow/stages/{stageId}/approve:
    post:
      operationId: approveWorkflowStage
      parameters:
        - { in: path, name: stageId, required: true, schema: { type: string } }
      responses:
        "202": { description: Stage approved and promotion resumed. }
  /workflow/validate:
    post:
      operationId: validateWorkflowDocument
      requestBody:
        required: true
        content:
          application/yaml: { schema: { type: string, maxLength: 1048576 } }
          application/json: { schema: {} }
      responses:
        "200": { description: Parsed and defaulted resources. }
        "422": { $ref: "#/components/responses/Problem" }
  /projects:
    get:
      operationId: listProjects
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201": { description: Project created. }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    put:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200": { description: Project updated. }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProject
      responses:
        "204": { description: Project deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /servers:
    get:
      operationId: listServers
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
    post:
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, runtime]
              properties:
                name: { type: string }
                address:
                  type: string
                  description: Required for Docker. Kubernetes derives its connection from the selected kubeconfig source.
                runtime: { type: string, enum: [docker, kubernetes, openshift, relay] }
                kubernetes: { $ref: "#/components/schemas/KubernetesServerConfig" }
                relay: { $ref: "#/components/schemas/RelayServerInput" }
                agentMode:
                  type: string
                  description: Compatibility hint. Manually registered hosts use SSH bootstrap.
      responses:
        "201": { description: Server inventory record created. Kubernetes targets are validated before becoming ready. }
        "400": { $ref: "#/components/responses/Problem" }
        "409":
          description: The local controller target is managed automatically from the Docker socket.
          $ref: "#/components/responses/Problem"
  /servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    put:
      operationId: updateServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                address:
                  type: string
                  description: Required when updating a Docker server.
                kubernetes: { $ref: "#/components/schemas/KubernetesServerConfig" }
                relay: { $ref: "#/components/schemas/RelayServerInput" }
      responses:
        "200": { description: Server updated. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteServer
      responses:
        "204": { description: Server deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /servers/{serverId}/repair:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      operationId: repairOpenShiftServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginCommand]
              properties:
                loginCommand:
                  type: string
                  writeOnly: true
                  description: Fresh non-interactive oc login command used once to rotate the managed token and rebuild the stored kubeconfig.
      responses:
        "200": { description: Managed OpenShift connection repaired. }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /servers/{serverId}/relay/verify:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      operationId: verifyRelayServer
      responses:
        "200": { description: Relay connection and durable queue status verified. }

  /relay/ssh/scan:
    post:
      summary: Read a relay node SSH host-key fingerprint
      operationId: scanRelaySSHHost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
      responses:
        "200":
          description: Fingerprint presented by the SSH node.

  /relay/ssh/install:
    post:
      summary: Install a relay on a verified node over SSH
      operationId: installRelayOverSSH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelaySSHInstallInput" }
      responses:
        "200": { description: Relay installed through systemd or Docker Compose. }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /servers/{serverId}/relay/webhooks:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: listRelayWebhooks
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
    post:
      operationId: createRelayWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayWebhookInput" }
      responses:
        "201": { description: Provider-neutral public webhook endpoint created on the relay. }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /servers/{serverId}/relay/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/ServerID"
      - in: path
        name: webhookId
        required: true
        schema: { type: string }
    delete:
      operationId: deleteRelayWebhook
      responses:
        "204": { description: Webhook endpoint removed from Dispatch and the relay. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /apps:
    get:
      operationId: listApps
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
    post:
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, serverId, name]
              properties:
                projectId: { type: string }
                serverId: { type: string }
                name: { type: string }
                template:
                  type: boolean
                  default: false
                  description: Saves a reusable definition that is instantiated by event rules or preview groups and cannot be deployed directly.
                sourceRepo:
                  type: string
                  description: HTTPS or SSH Git repository. For Helm, a relative helmChart path is loaded from this repository.
                sourceAuthType:
                  type: string
                  enum: [github_app, github_token, ssh_key]
                  description: Authentication transport for the attached GitHub App connection or write-only secret.
                sourceCredentialId:
                  type: string
                  description: ID of a ready GitHub App connection or an encrypted secret containing a GitHub token or complete SSH private key.
                composeContent:
                  type: string
                  maxLength: 524288
                  description: Docker Compose definition stored and deployed without Git.
                branch: { type: string, default: main }
                buildType: { type: string, enum: [dockerfile, compose, helm] }
                helmChart:
                  type: string
                  description: OCI or HTTPS chart reference, a relative chart name when helmRepository is set, or a relative path when sourceRepo is set.
                helmVersion: { type: string }
                helmRepository:
                  type: string
                  format: uri
                  description: Optional HTTPS chart repository.
                helmValues:
                  type: string
                  maxLength: 524288
                  description: Raw YAML overrides. Mutually exclusive with helmValueOverrides.
                helmValueOverrides:
                  type: object
                  additionalProperties: true
                  description: Structured overrides encoded to YAML before storage. Mutually exclusive with helmValues.
                helmNamespace: { type: string }
                helmRelease: { type: string }
                preDeployHook:
                  type: string
                  maxLength: 65536
                  deprecated: true
                  description: Legacy default for manual deployments. Event rules should define their own hook.
                postDeployHook:
                  type: string
                  maxLength: 65536
                  deprecated: true
                  description: Legacy default for manual deployments. Event rules should define their own hook.
      responses:
        "201": { description: Application specification created. }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /helm/inspect:
    post:
      operationId: inspectGitHelmSource
      description: Makes a temporary sparse checkout and returns chart metadata, default values, schema metadata, and values profile files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceRepo]
              properties:
                sourceRepo:
                  type: string
                  description: Git clone URL or GitHub-style browser URL ending in /tree/{branch}/{chartPath}.
                branch: { type: string, default: main }
                chartPath:
                  type: string
                  description: Relative chart directory. May be omitted when sourceRepo is a GitHub folder URL.
                sourceAuthType: { type: string, enum: [github_app, github_token, ssh_key] }
                sourceCredentialId: { type: string }
      responses:
        "200":
          description: Inspected Helm chart and value defaults.
          content:
            application/json:
              schema:
                type: object
                required: [repository, branch, chartPath, chart, defaults, valuesYaml, profiles]
                properties:
                  repository: { type: string }
                  branch: { type: string }
                  chartPath: { type: string }
                  chart: { type: object, additionalProperties: true }
                  defaults: { type: object, additionalProperties: true }
                  valuesYaml: { type: string }
                  schema: { type: object, additionalProperties: true }
                  profiles:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }
  /apps/{appId}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    delete:
      operationId: deleteApp
      description: Cleans deployed resources, then transactionally deletes the application and its deployment history.
      responses:
        "204": { description: Application and dependent history deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /apps/{appId}/hooks:
    put:
      operationId: updateAppHooks
      description: Replaces the scripts and write-only secret bindings used by manual deployments of an application.
      parameters:
        - $ref: "#/components/parameters/AppID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preDeployHook: { type: string, maxLength: 65536 }
                postDeployHook: { type: string, maxLength: 65536 }
                secretIds: { type: array, items: { type: string }, description: Write-only secrets exposed only to this application's hooks. }
      responses:
        "200": { description: Application hooks updated. }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /apps/{appId}/helm-values:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getAppHelmValues
      description: Loads a saved Helm source and returns its chart defaults, schema, profiles, and configured overrides to an authenticated operator.
      responses:
        "200":
          description: Helm chart configuration loaded.
          content:
            application/json:
              schema:
                type: object
                required: [chart, defaults, profiles, overrides]
                properties:
                  repository: { type: string }
                  branch: { type: string }
                  chartPath: { type: string }
                  chart: { type: object, additionalProperties: true }
                  defaults: { type: object, additionalProperties: true }
                  valuesYaml: { type: string }
                  schema: { type: object, additionalProperties: true }
                  profiles: { type: array, items: { type: object, additionalProperties: true } }
                  overrides: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAppHelmValues
      description: Replaces the structured Helm overrides saved for a Helm source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides]
              properties:
                overrides: { type: object, additionalProperties: true }
      responses:
        "200": { description: Helm overrides updated. }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /apps/{appId}/event-triggers:
    post:
      operationId: createEventTrigger
      parameters:
        - $ref: "#/components/parameters/AppID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                provider: { type: string, enum: [github], default: github }
                githubAppId: { type: string, description: GitHub App connection that receives events for this repository. Omit only for the legacy shared webhook. }
                repository: { type: string, description: Owner and repository name. }
                command: { type: string, default: /preview }
                enabled: { type: boolean, default: true }
                preDeployHook: { type: string, maxLength: 65536 }
                postDeployHook: { type: string, maxLength: 65536 }
                secretIds: { type: array, items: { type: string }, description: Write-only secrets exposed to this rule's hooks. }
      responses:
        "201": { description: Event trigger created. }
        "400": { $ref: "#/components/responses/Problem" }
  /event-triggers:
    get:
      operationId: listEventTriggers
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /event-triggers/{triggerId}:
    put:
      operationId: updateEventTrigger
      description: Updates the command, enabled state, and deployment hooks used by future event attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                githubAppId: { type: string, description: Replaces the GitHub App connection used by future events when provided. }
                command: { type: string, default: /preview }
                enabled: { type: boolean }
                preDeployHook: { type: string, maxLength: 65536 }
                postDeployHook: { type: string, maxLength: 65536 }
                secretIds: { type: array, items: { type: string } }
      responses:
        "200": { description: Event trigger updated. }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteEventTrigger
      responses:
        "204": { description: Event trigger deleted. }
        "404": { $ref: "#/components/responses/Problem" }
  /preview-environments:
    get:
      operationId: listPreviewEnvironments
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /preview-groups:
    get:
      operationId: listPreviewGroups
      responses:
        "200":
          description: Preview group definitions.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PreviewGroup" } }
    post:
      operationId: createPreviewGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewGroupInput" }
      responses:
        "201": { description: Preview group created. }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /preview-groups/{previewGroupId}:
    parameters:
      - $ref: "#/components/parameters/PreviewGroupID"
    get:
      operationId: getPreviewGroup
      responses:
        "200":
          description: Preview group definition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewGroup" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePreviewGroup
      description: Updates the configuration used by future attempts. Existing attempt snapshots remain immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewGroupInput" }
      responses:
        "200": { description: Preview group updated. }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePreviewGroup
      responses:
        "204": { description: Preview group deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /preview-group-runs:
    get:
      operationId: listPreviewGroupRuns
      parameters:
        - in: query
          name: groupId
          schema: { type: string }
      responses:
        "200":
          description: Preview group runs.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PreviewGroupRun" } }
  /preview-group-runs/{previewGroupRunId}:
    get:
      operationId: getPreviewGroupRun
      parameters:
        - $ref: "#/components/parameters/PreviewGroupRunID"
      responses:
        "200":
          description: Preview group run, sources, components, outputs, and deployment references.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewGroupRun" }
        "404": { $ref: "#/components/responses/Problem" }
  /preview-group-runs/{previewGroupRunId}/cleanup:
    post:
      operationId: cleanupPreviewGroupRun
      parameters:
        - $ref: "#/components/parameters/PreviewGroupRunID"
      responses:
        "200":
          description: Preview group cleaned up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewGroupRun" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /events/github:
    post:
      operationId: receiveGitHubEvent
      security: []
      description: Receives signed issue comment and pull request lifecycle events.
      responses:
        "202": { description: Event accepted. }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /events/github/apps/{githubAppId}:
    post:
      operationId: receiveGitHubAppEvent
      security: []
      description: Receives signed events for one stored GitHub App connection.
      parameters:
        - $ref: "#/components/parameters/GitHubAppID"
      responses:
        "202": { description: Event accepted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /apps/{appId}/cleanup:
    post:
      operationId: cleanupApplication
      parameters:
        - $ref: "#/components/parameters/AppID"
      responses:
        "204": { description: Application runtime resources removed. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /apps/{appId}/deployments:
    post:
      operationId: startDeployment
      description: Requires deployment.run. When review is supplied, project membership, application settings, binding mappings, and service revisions must still match the preview at atomic acceptance; changes return 409 and require another preview.
      parameters:
        - $ref: "#/components/parameters/AppID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commitSha: { type: string, default: HEAD }
                review: { $ref: "#/components/schemas/DeploymentReview" }
      responses:
        "202":
          description: Deployment accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "409": { $ref: "#/components/responses/Problem" }
  /deployments:
    get:
      operationId: listDeployments
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /deployments/{deploymentId}:
    get:
      operationId: getDeployment
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
      responses:
        "200":
          description: Deployment evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "404": { $ref: "#/components/responses/Problem" }
  /deployments/{deploymentId}/logs:
    get:
      operationId: listDeploymentLogs
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
        - in: query
          name: after
          schema: { type: integer, format: int64, default: 0 }
      responses:
        "200": { $ref: "#/components/responses/JSONList" }
  /deployments/{deploymentId}/events:
    get:
      operationId: streamDeploymentEvents
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
      responses:
        "200":
          description: Server-sent log and state events.
          content:
            text/event-stream: {}
  /deployments/{deploymentId}/cancel:
    post:
      operationId: cancelDeployment
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
      responses:
        "204": { description: Cancellation requested. }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      in: path
      name: projectId
      required: true
      schema: { type: string }
    ServerID:
      in: path
      name: serverId
      required: true
      schema: { type: string }
    AppID:
      in: path
      name: appId
      required: true
      schema: { type: string }
    DeploymentID:
      in: path
      name: deploymentId
      required: true
      schema: { type: string }
    PreviewGroupID:
      in: path
      name: previewGroupId
      required: true
      schema: { type: string }
    PreviewGroupRunID:
      in: path
      name: previewGroupRunId
      required: true
      schema: { type: string }
    GitHubAppID:
      in: path
      name: githubAppId
      required: true
      schema: { type: string }
  responses:
    JSONList:
      description: JSON array.
      content:
        application/json:
          schema: { type: array, items: {} }
    Problem:
      description: RFC 9457-style problem response.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    AnalyticsCounts:
      type: object
      required: [runs, succeeded, failed, cancelled, reused, durationSeconds, durationSamples, successRate, meanDurationSeconds, medianDurationSeconds, p95DurationSeconds]
      properties:
        runs: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        reused: { type: integer, minimum: 0 }
        durationSeconds:
          type: number
          description: Legacy total valid elapsed seconds across all completed outcomes.
        durationSamples: { type: integer, minimum: 0 }
        successRate:
          type: [number, 'null']
          description: Percentage succeeded among succeeded and failed runs; null for no denominator.
        meanDurationSeconds: { type: [number, 'null'] }
        medianDurationSeconds: { type: [number, 'null'], description: Estimated nearest-rank median. }
        p95DurationSeconds: { type: [number, 'null'], description: Estimated nearest-rank p95. }
    AnalyticsDay:
      type: object
      required: [date, deployments, workflows, jobs]
      properties:
        date: { type: string, description: UTC calendar date; empty for period totals. }
        deployments: { $ref: '#/components/schemas/AnalyticsCounts' }
        workflows: { $ref: '#/components/schemas/AnalyticsCounts' }
        jobs: { $ref: '#/components/schemas/AnalyticsCounts' }
    AnalyticsPeriod:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time, description: Inclusive boundary. }
        end: { type: string, format: date-time, description: Exclusive boundary. }
    AnalyticsFailureHotspot:
      type: object
      required: [projectId, kind, name, runs, succeeded, failed, cancelled, failureRate]
      properties:
        projectId: { type: string }
        kind: { type: string, enum: [deployment, workflow, job] }
        name: { type: string, description: Recorded workload name, not an immutable application identifier. }
        runs: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        failureRate: { type: number, description: Percentage failed among succeeded and failed runs. }
        latestFailedAt: { type: string, format: date-time }
        latestFailedDeploymentId: { type: string, description: Deployment facts only; operational retention may have removed this run. }
    AnalyticsSlowWorkload:
      type: object
      required: [projectId, kind, name, runs, durationSamples, meanDurationSeconds]
      properties:
        projectId: { type: string }
        kind: { type: string, enum: [deployment, workflow, job] }
        name: { type: string }
        runs: { type: integer }
        durationSamples: { type: integer }
        meanDurationSeconds: { type: number }
        latestDeploymentId: { type: string, description: Latest timed successful deployment; operational retention may have removed it. }
    AnalyticsSummary:
      type: object
      required: [state, days, daily, totals, period, previousPeriod, previousTotals, failureHotspots, slowWorkloads, capabilities, coverage]
      properties:
        state: { type: string, enum: [disabled, starting, catching_up, ready, unavailable] }
        updatedAt: { type: string, format: date-time, description: Last published snapshot time; retained when the worker is unavailable. }
        days: { type: integer, enum: [7, 30, 90] }
        daily: { type: array, items: { $ref: '#/components/schemas/AnalyticsDay' } }
        totals: { $ref: '#/components/schemas/AnalyticsDay' }
        period: { $ref: '#/components/schemas/AnalyticsPeriod' }
        previousPeriod: { $ref: '#/components/schemas/AnalyticsPeriod' }
        previousTotals: { $ref: '#/components/schemas/AnalyticsDay' }
        failureHotspots:
          type: array
          maxItems: 30
          description: Up to ten entries per kind, ordered by failed count then failure rate.
          items: { $ref: '#/components/schemas/AnalyticsFailureHotspot' }
        slowWorkloads:
          type: array
          maxItems: 30
          description: Up to ten entries per kind, ordered by mean duration then sample count.
          items: { $ref: '#/components/schemas/AnalyticsSlowWorkload' }
        capabilities:
          type: object
          properties:
            durationPercentiles: { type: string, const: histogram }
            durationPercentileMaxErrorPercent: { type: integer, const: 5 }
            durationPercentileResolutionSeconds: { type: number, const: 0.01 }
            durationPopulation: { type: string, const: successful_non_reused }
            stageTiming: { type: boolean, const: false }
            environmentBreakdown: { type: boolean, const: false }
        coverage:
          type: object
          description: Observed completion range in visible projects; does not guarantee continuous collection.
          properties:
            firstCompletedAt: { type: string, format: date-time }
            lastCompletedAt: { type: string, format: date-time }
    DeploymentReview:
      type: object
      required: [expectedAppName, projectId, appSpecDigest, bindingsDigest, serviceRevisions]
      properties:
        expectedAppName: { type: string, description: Application name used when previewing release identity. }
        projectId: { type: string }
        appSpecDigest: { type: string }
        bindingsDigest: { type: string }
        serviceRevisions:
          type: object
          additionalProperties: { type: integer }
      description: Exact nonsecret input identity captured by preview. Supplied unchanged when accepting the reviewed deployment.
    DeploymentCatalogStatus:
      type: object
      properties:
        staleAfterSeconds:
          type: integer
          description: Configured application observation freshness threshold; defaults to 900.
        configuration:
          type: string
        revision:
          type: string
        drift:
          type: string
        health:
          type: string
        supported:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
        healthMessage:
          type: string
    DeploymentCatalogItem:
      type: object
      required:
      - appId
      - appName
      - projectId
      - targetId
      - targetName
      - environment
      properties:
        appId:
          type: string
        appName:
          type: string
        projectId:
          type: string
        targetId:
          type: string
        targetName:
          type: string
        environment:
          type: string
        resourceId:
          type: string
        resourceName:
          type: string
        latest:
          $ref: '#/components/schemas/Deployment'
        current:
          $ref: '#/components/schemas/Deployment'
        sync:
          $ref: '#/components/schemas/DeploymentCatalogStatus'
    SavedDeploymentComparison:
      type: object
      properties:
        fromId:
          type: string
        toId:
          type: string
        available:
          type: boolean
        hidden:
          type: integer
        truncated:
          type: boolean
        message:
          type: string
        changes:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              kind:
                type: string
                enum:
                - added
                - removed
                - changed
              before: {}
              after: {}
    ObservationConfiguration:
      type: object
      properties:
        appId:
          type: string
        projectId:
          type: string
        revision:
          type: integer
        scheduled:
          type: boolean
        intervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        staleAfterSeconds:
          type: integer
          minimum: 60
          maximum: 604800
        endpointUrl:
          type: string
        notificationsEnabled:
          type: boolean
        webhookConfigured:
          type: boolean
        mutedUntil:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    ObservationConfigurationInput:
      type: object
      required:
      - revision
      - scheduled
      - intervalSeconds
      - staleAfterSeconds
      - notificationsEnabled
      properties:
        revision:
          type: integer
        scheduled:
          type: boolean
        intervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        staleAfterSeconds:
          type: integer
          minimum: 60
          maximum: 604800
        endpointUrl:
          type: string
          description: Optional HTTP(S) endpoint without user information or query credentials.
        notificationsEnabled:
          type: boolean
        webhookUrl:
          type: string
          writeOnly: true
          description: Optional HTTPS delivery URL; omitted preserves the existing encrypted destination.
        removeWebhook:
          type: boolean
        mutedUntil:
          type:
          - string
          - 'null'
          format: date-time
    EndpointObservation:
      type: object
      properties:
        state:
          type: string
        tls:
          type: string
        httpStatus:
          type: integer
        certificateExpiresAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        message:
          type: string
        location:
          type: string
          const: Dispatch controller
    ApplicationObservation:
      type: object
      properties:
        appId:
          type: string
        projectId:
          type: string
        configurationRevision:
          type: integer
        deploymentId:
          type: string
        source:
          type: string
        state:
          type: string
        drift:
          type: string
        health:
          type: string
        endpoint:
          $ref: '#/components/schemas/EndpointObservation'
        checkedAt:
          type: string
          format: date-time
        nextCheckAt:
          type: string
          format: date-time
        consecutiveFailures:
          type: integer
        message:
          type: string
        location:
          type: string
    ObservationEvent:
      type: object
      properties:
        id:
          type: string
        appId:
          type: string
        projectId:
          type: string
        deploymentId:
          type: string
        configurationRevision:
          type: integer
        kind:
          type: string
        previousState:
          type: string
        state:
          type: string
        message:
          type: string
        link:
          type: string
        createdAt:
          type: string
          format: date-time
        delivery:
          type: string
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        deliveryMessage:
          type: string
    ObservationStatus:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/ObservationConfiguration'
        observation:
          $ref: '#/components/schemas/ApplicationObservation'
        freshness:
          type: string
          enum:
          - not_checked
          - fresh
          - stale
          - checking
        checking:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/ObservationEvent'
    ReleaseNote:
      type: object
      properties:
        deploymentId:
          type: string
        notes:
          type: string
        links:
          type: array
          items:
            type: string
        actor:
          type: string
        updatedAt:
          type: string
          format: date-time
    ReleasePreview:
      type: object
      properties:
        review: { $ref: "#/components/schemas/DeploymentReview" }
        ready:
          type: boolean
        revision:
          type: string
        target:
          type: string
        namespace:
          type: string
        release:
          type: string
        bindings:
          type: array
          items:
            type: object
        comparison:
          $ref: '#/components/schemas/SavedDeploymentComparison'
        message:
          type: string
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              state:
                type: string
              message:
                type: string
        resources:
          type: array
          items:
            type: object
    RollbackPreview:
      type: object
      properties:
        available:
          type: boolean
        deploymentId:
          type: string
        currentDeploymentId:
          type: string
        helmRevision:
          type: integer
        message:
          type: string
        bindings:
          type: array
          items:
            type: object
        resources:
          type: array
          items:
            type: object
    ApplicationOwner:
      type: object
      properties:
        appId:
          type: string
        principalType:
          type: string
          enum:
          - user
          - team
          - ''
        principalId:
          type: string
        displayName:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        impersonatorId:
          type: string
        projectId:
          type: string
        appId:
          type: string
        action:
          type: string
        resourceId:
          type: string
        outcome:
          type: string
        createdAt:
          type: string
          format: date-time
    IdentityTeamMapping:
      type: object
      properties:
        id:
          type: string
        providerId:
          type: string
        externalGroup:
          type: string
          description: GitHub organization/team-slug.
        teamId:
          type: string
    RetentionPolicy:
      type: object
      required:
      - logDays
      - runDays
      - keepRuns
      properties:
        projectId:
          type: string
        logDays:
          type: integer
          minimum: 1
          maximum: 36500
        runDays:
          type: integer
          minimum: 1
          maximum: 36500
        keepRuns:
          type: integer
          minimum: 5
          maximum: 10000
    RetentionResult:
      type: object
      properties:
        logs:
          type: integer
        runs:
          type: integer
        protectedRuns:
          type: integer
        applied:
          type: boolean
    BackupRecord:
      type: object
      properties:
        id:
          type: string
        engine:
          type: string
        state:
          type: string
        bytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
        message:
          type: string
    ServiceImpact:
      type: object
      properties:
        serviceId:
          type: string
        revision:
          type: integer
        consumers:
          type: array
          items:
            type: object
            properties:
              appId:
                type: string
              appName:
                type: string
              alias:
                type: string
              appliedRevision:
                type: integer
              redeploymentRequired:
                type: boolean
              targetName:
                type: string
              environment:
                type: string
              deploymentId:
                type: string
              canRedeploy:
                type: boolean
              reason:
                type: string
    RoleAssignmentInput:
      type: object
      required:
      - principalType
      - principalId
      - projectId
      - role
      properties:
        principalType:
          type: string
          enum:
          - user
          - team
        principalId:
          type: string
        projectId:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
          - deployer
          - viewer
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Omit to preserve an existing expiry; null explicitly clears it. Expired grants do not authorize
            new requests.
    EdgeSession:
      type: object
      properties:
        token:
          type: string
          readOnly: true
          description: Returned once with Cache-Control no-store; keep only in protected process memory.
        expiresAt:
          type: string
          format: date-time
        generation:
          type: integer
    ApplicationSync:
      type: object
      required: [appId, supported, reapplyAvailable, configuration, revision, drift, actions]
      properties:
        appId: { type: string }
        deploymentId: { type: string }
        supported: { type: boolean }
        reapplyAvailable: { type: boolean }
        configuration:
          type: object
          properties:
            state: { type: string }
            message: { type: string }
            sourceId: { type: string }
            lastSyncedAt: { type: string, format: date-time }
        revision:
          type: object
          properties:
            state: { type: string }
            applied: { type: string }
            observed: { type: string }
        drift:
          type: object
          properties:
            deploymentId: { type: string }
            state: { type: string, enum: [synced, out_of_sync, unknown] }
            health: { type: string, enum: [healthy, progressing, degraded, unknown, not_applicable] }
            healthMessage: { type: string, description: Readiness coverage or the reason it could not be determined. }
            message: { type: string }
            checkedAt: { type: string, format: date-time }
            lastSuccessfulCheckAt: { type: string, format: date-time }
            location: { type: string, const: Dispatch controller }
            resources:
              type: array
              items:
                type: object
                properties:
                  apiVersion: { type: string }
                  kind: { type: string }
                  namespace: { type: string }
                  name: { type: string }
                  state: { type: string, enum: [synced, out_of_sync, missing, unknown] }
                  health: { type: string }
                  message: { type: string, description: Sanitized resource access or readiness limitation. }
                  truncated: { type: boolean }
                  differences:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        expected: {}
                        actual: {}
                        redacted: { type: boolean }
        actions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              appId: { type: string }
              deploymentId: { type: string }
              actor: { type: string }
              state: { type: string, enum: [running, succeeded, failed] }
              message: { type: string }
              createdAt: { type: string, format: date-time }
    ServiceInput:
      type: object
      description: Project, name and type are required at creation and immutable thereafter. Omitted fields are preserved. Only the controller owner can attach global secret references.
      properties:
        projectId: { type: string }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{0,62}$" }
        type: { type: string, enum: [postgresql, generic] }
        description: { type: string }
        revision: { type: integer, description: Expected current revision for optimistic concurrency. }
        connectionUrl: { type: string, writeOnly: true, description: PostgreSQL URL input instead of individual fields. }
        probeHost: { type: string }
        probePort: { type: integer }
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              value: { type: string, writeOnly: true, maxLength: 65536 }
              sensitive: { type: boolean }
              secretRef: { type: string }
              remove: { type: boolean }
    Service:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        type: { type: string, enum: [postgresql, generic] }
        description: { type: string }
        revision: { type: integer }
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              value: { type: string, description: Ordinary fields only. }
              sensitive: { type: boolean }
              configured: { type: boolean }
              secretRef: { type: string, description: Visible only to the controller owner. }
        availableFields: { type: array, items: { type: string } }
        check: { $ref: "#/components/schemas/ServiceCheck" }
        consumers:
          type: array
          items:
            type: object
            properties:
              appId: { type: string }
              appName: { type: string }
              alias: { type: string }
              appliedRevision: { type: integer }
              redeploymentRequired: { type: boolean }
    ServiceCheck:
      type: object
      properties:
        state: { type: string, enum: [succeeded, failed, untested] }
        message: { type: string }
        location: { type: string, const: Dispatch controller }
        checkedAt: { type: string, format: date-time }
        durationMs: { type: integer }
    ServiceBinding:
      type: object
      required: [alias, serviceRef]
      description: Select exactly one runtime mapping. Destinations map to service field names.
      properties:
        alias: { type: string }
        serviceRef: { type: string, description: Service ID in app APIs; project-local name or ID in repository YAML. }
        environment: { type: object, additionalProperties: { type: string } }
        compose:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        helm:
          type: object
          required: [keys, secretNameValues]
          properties:
            keys: { type: object, additionalProperties: { type: string } }
            secretNameValues: { type: array, items: { type: string } }
            keyValues: { type: object, additionalProperties: { type: string } }
    ConfigSourceInput:
      type: object
      required: [projectId, githubAppId, name, repository, branch, path, syncMode, pollIntervalSeconds]
      properties:
        projectId: { type: string }
        githubAppId: { type: string }
        name: { type: string, maxLength: 80 }
        repository: { type: string, description: GitHub owner/name accessible to the selected installation. }
        branch: { type: string, default: main }
        path: { type: string, default: .dispatch }
        syncMode: { type: string, enum: [webhook_poll, webhook, poll], default: webhook_poll }
        pollIntervalSeconds: { type: integer, minimum: 30, maximum: 86400, default: 300 }
    ConfigSource:
      allOf:
        - $ref: "#/components/schemas/ConfigSourceInput"
        - type: object
          required: [id, active, state, createdAt, updatedAt]
          properties:
            id: { type: string }
            active: { type: boolean }
            state: { type: string, enum: [syncing, ready, degraded, invalid] }
            lastSeenSha: { type: string }
            lastSyncedAt: { type: string, format: date-time }
            lastPolledAt: { type: string, format: date-time }
            lastError: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    WorkflowResource:
      type: object
      required: [id, configSourceId, apiVersion, kind, name, path, document, specDigest, configSha, active, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        configSourceId: { type: string }
        apiVersion: { type: string, const: dispatch/v1alpha1 }
        kind: { type: string, enum: [Application, Pipeline] }
        name: { type: string }
        path: { type: string }
        document: { type: string, description: Canonical YAML with defaults applied. }
        specDigest: { type: string }
        configSha: { type: string }
        active: { type: boolean }
        state: { type: string, enum: [ready, paused, invalid] }
        lastError: { type: string }
        sourceCount: { type: integer }
        jobCount: { type: integer }
        stageNames: { type: array, items: { type: string } }
        targetRefs: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowTopology:
      type: object
      required: [columns, nodes, edges]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        nodes:
          type: array
          items:
            type: object
            required: [id, column, kind, label]
            properties:
              id: { type: string }
              column: { type: string }
              kind: { type: string }
              label: { type: string }
              detail: { type: string }
              metadata: { type: object, additionalProperties: { type: string } }
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind]
            properties:
              from: { type: string }
              to: { type: string }
              kind: { type: string }
    SecretStoreInput:
      type: object
      required: [name, provider, serviceUrl]
      properties:
        name: { type: string, maxLength: 80 }
        provider: { type: string, enum: [ibm_cloud_secrets_manager] }
        serviceUrl: { type: string, format: uri }
        iamUrl: { type: string, format: uri, default: "https://iam.cloud.ibm.com" }
        apiKey: { type: string, format: password, writeOnly: true, description: Required when creating; omit from updates to retain it. }
        privateNetworkId: { type: string, description: Optional edge node used for provider requests. }
    SecretStore:
      type: object
      required: [id, name, provider, config, credentialsConfigured, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        config: { type: object, additionalProperties: { type: string } }
        credentialsConfigured: { type: boolean }
        state: { type: string, enum: [ready, error] }
        lastVerifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EdgeNode:
      type: object
      required: [id, name, driver, config, details, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        driver: { type: string, enum: [dispatch_agent, laneway_connector, laneway, laneway_network] }
        config: { type: object, additionalProperties: { type: string } }
        details: { type: object, additionalProperties: { type: string } }
        enrollmentToken: { type: string, writeOnly: true, description: Returned only on create or rotation. }
        credentialsConfigured: { type: boolean, description: True for a connected Laneway network. }
        state: { type: string, enum: [waiting, ready, offline, error, unverified] }
        lastVerifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LanewayInventory:
      type: object
      required: [network, nodes, endpointStatuses, routes]
      properties:
        network:
          type: object
          required: [network_id, name, ipv4_pool, configuration_epoch]
          properties:
            network_id: { type: string }
            name: { type: string }
            ipv4_pool: { type: string }
            ipv6_pool: { type: string }
            configuration_epoch: { type: integer, format: int64 }
        nodes:
          type: array
          items:
            type: object
            required: [node_id, network_id, name, enrollment_class]
            properties:
              node_id: { type: string }
              network_id: { type: string }
              name: { type: string }
              ipv4_address: { type: string }
              ipv6_address: { type: string }
              enrollment_class: { type: string }
              enabled_capabilities: { type: integer, format: int64 }
              revoked_at_unix_seconds: { type: integer, format: int64 }
        endpointStatuses:
          type: array
          items:
            type: object
            required: [node_id, network_id, node_name, freshness]
            properties:
              node_id: { type: string }
              network_id: { type: string }
              node_name: { type: string }
              freshness: { type: string }
              last_reported_at_unix_seconds: { type: integer, format: int64 }
        routes:
          type: array
          items:
            type: object
            required: [route_id, network_id, node_id, prefix, kind, mode, metric, state]
            properties:
              route_id: { type: string }
              network_id: { type: string }
              node_id: { type: string }
              prefix: { type: string }
              kind: { type: string }
              mode: { type: string }
              metric: { type: integer }
              state: { type: string }
    LanewayNodeInstaller:
      type: object
      required: [installation_id, command, expires_at_unix_seconds]
      properties:
        installation_id: { type: string }
        command: { type: string, writeOnly: true }
        expires_at_unix_seconds: { type: integer, format: int64 }
    LanewayRoute:
      type: object
      required: [route_id, network_id, node_id, prefix, kind, mode, metric, state]
      properties:
        route_id: { type: string }
        network_id: { type: string }
        node_id: { type: string }
        prefix: { type: string }
        kind: { type: string }
        mode: { type: string }
        metric: { type: integer }
        state: { type: string }
    GitHubAppInput:
      type: object
      required: [name, webUrl, appId, privateKey, webhookSecret]
      properties:
        name: { type: string, maxLength: 80 }
        webUrl: { type: string, format: uri, example: "https://github.example.com" }
        apiUrl: { type: string, format: uri, description: Derived from webUrl when omitted. }
        appId: { type: integer, format: int64 }
        clientId: { type: string }
        slug: { type: string }
        registrationOwner: { type: string, description: Login of the account that owns the App registration. }
        registrationOwnerType: { type: string, description: GitHub account type returned for the registration owner. }
        installationId: { type: integer, format: int64 }
        privateKey: { type: string, format: password, writeOnly: true, description: RSA PEM generated by GitHub. }
        webhookSecret: { type: string, format: password, minLength: 16, writeOnly: true }
        eventDelivery: { type: string, enum: [none, direct, relay], default: direct }
        relayServerId: { type: string, description: Optional relay server used for durable outbound event delivery. }
        privateNetworkId: { type: string, description: Optional edge node used for GitHub API requests. }
    GitHubAppConnection:
      type: object
      required: [id, name, webUrl, apiUrl, appId, privateKeyConfigured, webhookSecretConfigured, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        webUrl: { type: string, format: uri }
        apiUrl: { type: string, format: uri }
        appId: { type: integer, format: int64 }
        clientId: { type: string }
        slug: { type: string }
        installationId: { type: integer, format: int64 }
        installationAccount: { type: string }
        installationUrl: { type: string, format: uri, description: GitHub-provided settings URL for this installation. }
        webhookUrl: { type: string, format: uri, description: Present when webhook delivery is enabled. }
        relayWebhookId: { type: string, description: Present when events are delivered through a relay. }
        privateNetworkId: { type: string, description: Edge node used for GitHub API requests. }
        privateKeyConfigured: { type: boolean }
        webhookSecretConfigured: { type: boolean }
        state: { type: string, enum: [needs_installation, unverified, ready] }
        lastVerifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GitHubAppUpdateInput:
      type: object
      description: Every property is optional. Private key and webhook secret must be replaced together.
      properties:
        name: { type: string, maxLength: 80 }
        webUrl: { type: string, format: uri }
        apiUrl: { type: string, format: uri }
        appId: { type: integer, format: int64 }
        clientId: { type: string }
        slug: { type: string }
        installationId: { type: integer, format: int64 }
        privateKey: { type: string, format: password, writeOnly: true }
        webhookSecret: { type: string, format: password, minLength: 16, writeOnly: true }
        privateNetworkId: { type: string, description: Edge node used for GitHub API requests. Set to an empty string for direct access. }
    GitHubRepository:
      type: object
      required: [id, fullName, name, owner, defaultBranch, private, webUrl]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string, example: platform/service }
        name: { type: string, example: service }
        owner: { type: string, example: platform }
        defaultBranch: { type: string, example: main }
        private: { type: boolean }
        webUrl: { type: string, format: uri }
    KubernetesServerConfig:
      type: object
      properties:
        source:
          type: string
          enum: [stored, path, openshift]
          description: Store pasted credentials, use a controller-mounted file, or bootstrap a managed OpenShift connection.
        kubeconfigPath:
          type: string
          description: Absolute path to a readable kubeconfig mounted on the controller.
        kubeconfig:
          type: string
          writeOnly: true
          maxLength: 4194304
          description: Kubeconfig YAML saved in Dispatch storage. Omit during updates to retain the stored value.
        certificateAuthority:
          type: string
          writeOnly: true
          maxLength: 1048576
          description: Optional PEM CA bundle used when the selected cluster does not embed certificate-authority-data.
        loginCommand:
          type: string
          writeOnly: true
          description: Non-interactive oc login syntax. Dispatch parses it and calls OpenShift APIs directly; the command is never executed or stored.
        kubeconfigStored:
          type: boolean
          readOnly: true
        certificateAuthorityStored:
          type: boolean
          readOnly: true
        context:
          type: string
          description: Existing kubeconfig context. The current context is used when omitted.
        namespace:
          type: string
          default: default
        openShift:
          type: object
          readOnly: true
          properties:
            managed: { type: boolean }
            serviceAccount: { type: string }
            serviceAccountNamespace: { type: string }
            tokenSecret: { type: string }
            connectedAt: { type: string, format: date-time }
    Overview:
      type: object
      required: [demo, projects, servers, apps, deployments, previewGroups, previewGroupRuns, githubApps, configSources, workflowResources, workflowRevisions, workflowStageRuns]
      properties:
        demo: { type: boolean }
        projects: { type: array, items: { type: object } }
        servers: { type: array, items: { type: object } }
        apps: { type: array, items: { type: object } }
        deployments: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        previewGroups: { type: array, items: { $ref: "#/components/schemas/PreviewGroup" } }
        previewGroupRuns: { type: array, items: { $ref: "#/components/schemas/PreviewGroupRun" } }
        secretStores: { type: array, items: { $ref: "#/components/schemas/SecretStore" } }
        githubApps: { type: array, items: { $ref: "#/components/schemas/GitHubAppConnection" } }
        relayWebhooks: { type: array, items: { $ref: "#/components/schemas/RelayWebhook" } }
        configSources: { type: array, items: { $ref: "#/components/schemas/ConfigSource" } }
        workflowResources: { type: array, items: { $ref: "#/components/schemas/WorkflowResource" } }
        workflowRevisions: { type: array, items: { type: object } }
        workflowStageRuns: { type: array, items: { type: object } }
    RelayServerInput:
      type: object
      properties:
        accessToken: { type: string, format: password, minLength: 24, writeOnly: true, description: Scoped bearer token configured on the relay node. }
    RelaySSHInstallInput:
      type: object
      required: [host, user, authType, hostKeyFingerprint, relayUrl, relayToken]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        user: { type: string }
        authType: { type: string, enum: [password, private_key] }
        password: { type: string, format: password, writeOnly: true }
        privateKey: { type: string, format: password, writeOnly: true }
        secretId: { type: string, description: ID of a saved SSH private key. Replaces privateKey when set. }
        privateKeyPassword: { type: string, format: password, writeOnly: true }
        sudoPassword: { type: string, format: password, writeOnly: true }
        hostKeyFingerprint: { type: string, example: "SHA256:..." }
        relayUrl: { type: string, format: uri }
        relayToken: { type: string, format: password, minLength: 24, writeOnly: true }
        installMode: { type: string, enum: [systemd, docker], default: systemd }
        relayImage: { type: string, description: Optional container image used when installMode is docker. }
    RelayWebhookInput:
      type: object
      required: [name, provider]
      properties:
        name: { type: string, maxLength: 80 }
        provider: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$" }
        providerConnectionId: { type: string, description: Provider adapter connection that verifies and normalizes deliveries. }
    RelayWebhook:
      type: object
      required: [id, serverId, name, provider, remoteId, url, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        serverId: { type: string }
        name: { type: string }
        provider: { type: string }
        providerConnectionId: { type: string }
        remoteId: { type: string }
        url: { type: string, format: uri }
        state: { type: string }
        lastDeliveryAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PreviewGroupBinding:
      type: object
      required: [source, helmValuePath]
      properties:
        source: { type: string, example: service.url }
        helmValuePath: { type: string, example: config.backendUrl }
    PreviewGroupComponentInput:
      type: object
      required: [appId, alias, repository, defaultBranch, entrypoint, dependsOn]
      properties:
        appId: { type: string }
        alias: { type: string, pattern: "^[a-z][a-z0-9-]{0,30}$" }
        repository: { type: string, description: Owner and repository name. }
        defaultBranch: { type: string }
        entrypoint: { type: boolean }
        dependsOn: { type: array, items: { type: string } }
        bindings: { type: array, items: { $ref: "#/components/schemas/PreviewGroupBinding" } }
        preDeployHook: { type: string, maxLength: 65536 }
        postDeployHook: { type: string, maxLength: 65536 }
        secretIds: { type: array, items: { type: string }, description: Write-only secrets exposed to this component's build hooks. }
    PreviewGroupInput:
      type: object
      required: [name, command, components]
      properties:
        name: { type: string, maxLength: 80 }
        githubAppId: { type: string, description: GitHub App connection that receives events and can access every component repository. Omit only for the legacy shared webhook. }
        command: { type: string, default: /preview }
        enabled: { type: boolean, default: true }
        components: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PreviewGroupComponentInput" } }
    PreviewGroup:
      allOf:
        - $ref: "#/components/schemas/PreviewGroupInput"
        - type: object
          required: [id, enabled, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PreviewGroupRun:
      type: object
      required: [id, groupId, slug, namespace, state, attempt, sources, components, createdAt, updatedAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        slug: { type: string }
        namespace: { type: string }
        state:
          type: string
          enum: [requested, deploying, ready, rolling_back, degraded, failed, cleaning, closed]
        message: { type: string }
        entrypointUrl: { type: string, format: uri }
        attempt: { type: integer }
        sources: { type: array, items: { type: object } }
        components: { type: array, items: { type: object } }
        attempts: { type: array, items: { type: object } }
        group: { $ref: "#/components/schemas/PreviewGroup" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    Deployment:
      type: object
      required: [id, appId, commitSha, specDigest, state, message, createdAt]
      properties:
        id: { type: string }
        appId: { type: string }
        commitSha: { type: string }
        specDigest: { type: string }
        state:
          type: string
          enum: [queued, fetching, building, starting, checking, routing, succeeded, failed, cancelled]
        message: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [status, title, detail]
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
