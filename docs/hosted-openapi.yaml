openapi: 3.1.0
info:
  title: Dispatch hosted API
  version: 0.1.0
  description: Hosted identity, metadata-only platform administration, tenant membership and registered tenant console hosts. Custom DNS editing is unavailable. Browser mutations require an exact Origin when cookies are present. No CORS access is granted
    to sibling workload hosts. Tenant operational endpoints are documented separately in openapi.yaml.
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: dispatch.cicd.onl
      description: Use the root host for account/platform APIs and an exact tenant console host for tenant
        APIs.
security:
- platformSession: []
- bearerSession: []
paths:
  /tenants/{id}/connection:
    parameters:
    - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getHostedInstanceConnection
      description: Active instance members can inspect connection state, remote access policy and the owner-approved direct address. Platform administrator status alone grants no access.
      responses:
        '200': { description: Connection state. }
        '403': { description: Instance membership required. }
    post:
      operationId: createHostedInstanceEnrollment
      description: Instance owner only. Issue a ten-minute, single-use enrollment token. A live grant must be disconnected before enrolling a replacement installation. The response contains enrollmentToken, expiresAt, platformURL and the owner's stable subject ID.
      responses:
        '201': { description: One-use enrollment token. }
        '403': { description: Instance owner access required. }
        '409': { description: A server is already enrolled or the instance uses embedded storage. }
    delete:
      operationId: revokeHostedInstanceConnection
      description: Instance owner only. Revoke the installation credential and instance sessions and close active outbound streams. Local access and workloads remain independent.
      responses:
        '204': { description: Connection revoked. }
        '403': { description: Instance owner access required. }
  /instance-connections/enroll:
    post:
      operationId: enrollHostedInstance
      security: []
      description: Self-hosted installation only, without browser cookies or Origin. Exchange an enrollment token for instanceID, credential, generation, websocketURL, ownerSubject, instanceSlug and rootDomain. The platform never contacts the supplied direct URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollmentToken, installationID]
              properties:
                enrollmentToken: { type: string }
                installationID: { type: string }
                directURL: { type: string }
                remoteAccess: { type: boolean, default: false }
      responses:
        '201': { description: Installation credential and versioned connection endpoint. }
        '403': { description: Browser request or enrollment denied. }
  /instance-connections/ws:
    get:
      operationId: connectHostedInstanceSocket
      security:
      - installationGrant: []
      description: Installation bearer credential only. The self-hosted controller initiates a WebSocket using the doodship-instance-v1 subprotocol. Supports bounded HTTP and SSE forwarding; application WebSocket upgrades are not supported.
      responses:
        '101': { description: Outbound instance connection established. }
        '401': { description: Missing or revoked installation credential. }
  /instance-connections/policy:
    put:
      operationId: updateHostedInstancePolicy
      security:
      - installationGrant: []
      description: Installation bearer credential only, without browser cookies or Origin. Publish the locally approved directURL and remoteAccess policy. Changing the policy closes existing streams before reconnection.
      responses:
        '204': { description: Policy updated. }
  /instance-connections/current:
    delete:
      operationId: revokeCurrentHostedInstance
      security:
      - installationGrant: []
      description: Installation bearer credential only. Revoke this installation's grant and instance sessions.
      responses:
        '204': { description: Grant revoked. }
  /instance-connections/routes:
    get:
      operationId: listConnectedInstanceRoutes
      security:
      - installationGrant: []
      description: Installation bearer credential only. List this instance's registered hostname ownership IDs, without deployment destinations.
      responses:
        '200': { description: Registered addresses. }
        '409':
          description: The registered address inventory exceeds the active address limit. Remove unused application routes before publishing another.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      operationId: publishConnectedInstanceRoute
      security:
      - installationGrant: []
      description: Installation bearer credential only. Reserve a generated single-label hostname using appID, projectID, serverID and optional previewNumber. The live destination stays on the self-hosted backend.
      responses:
        '201': { description: Reserved hostname. }
        '409':
          description: This instance has reached its active address limit. Remove unused application routes before publishing another.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: releaseConnectedInstanceRoute
      security:
      - installationGrant: []
      description: Installation bearer credential only. Release this instance's route identified by appID and serverID.
      responses:
        '204': { description: Address released. }
  /instance-connections/usage:
    post:
      operationId: reportConnectedInstanceUsage
      security:
      - installationGrant: []
      description: Installation bearer credential only. Replace daily aggregate totals for this instance within the last seven days. Reject cross-instance reports. Retain connected-instance daily usage for 90 days.
      responses:
        '204': { description: Aggregate report saved. }
  /hosted:
    get:
      operationId: hostedMode
      description: Available on the root and registered tenant console hosts. Returns mode, origin, and
        either registrationEnabled or tenant and loginUrl.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - platform
                    - tenant
                  origin: &id001
                    type: string
                  registrationEnabled:
                    type: boolean
                  waitlistEnabled:
                    type: boolean
                    description: The sign-in page offers the WorkOS waitlist.
                  workosLoginMethods:
                    type: array
                    items:
                      type: string
                      enum: [email-code, password, github, google, sso]
                  authkitEnabled:
                    type: boolean
                  reservedTenantNames:
                    type: array
                    items:
                      type: string
                    description: Tenant names reserved by this installation, including local.
                  passwordLoginEnabled:
                    type: boolean
                  tenant:
                    $ref: '#/components/schemas/Tenant'
                  loginUrl: *id001
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /account/workos/authenticate:
    post:
      operationId: authenticateManagedAccount
      description: Doodship login backed by WorkOS. Requires an exact Origin header. Start with method and email; password is required for the password method. Email codes only provision users with a validated invitation or an existing active, verified account. Continue with a browser-bound state and code or organizationId. With password migration enabled, link-account requires previousPassword after WorkOS authentication; email verification alone never links accounts. Resume retrieves and rotates a continuation. Retries cannot extend the original ten-minute deadline. Tenant handoffs retain their target organization and still require local membership.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [email-code, password]
                email:
                  type: string
                  format: email
                password:
                  type: string
                  maxLength: 4096
                previousPassword:
                  type: string
                  maxLength: 4096
                  description: Previous Doodship password for link-account. Checked locally and never forwarded to WorkOS. Account linking is blocked in production-data previews.
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                state:
                  type: string
                organizationId:
                  type: string
                invitationToken:
                  type: string
                  maxLength: 512
                tenantId:
                  type: string
                codeChallenge:
                  type: string
                link:
                  type: boolean
                  description: Requires a current local account session and the same email.
                resume:
                  type: boolean
      responses:
        '200':
          description: Next login step, retry message with rotated state, or completed login with a host-only session cookie. Provider continuation tokens never leave the server. TOTP setup keys are returned only during enrollment.
          content:
            application/json:
              schema:
                type: object
                required: [step]
                properties:
                  step:
                    type: string
                    enum: [email-code, verify-email, totp, organization, link-account, complete]
                  state:
                    type: string
                  email:
                    type: string
                  secret:
                    type: string
                  message:
                    type: string
                  returnTo:
                    type: string
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        default:
          $ref: '#/components/responses/Problem'
  /account/workos/invitation:
    post:
      operationId: inspectManagedInvitation
      description: Validates a pending unexpired WorkOS invitation and returns its email. Requires an exact Origin header. No account or session is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Validated invitation email.
        default:
          $ref: '#/components/responses/Problem'
  /account/workos/waitlist:
    post:
      operationId: joinManagedWaitlist
      description: Adds an email to the WorkOS environment's default waitlist and requests its confirmation email. Existing accounts receive the same response. No Doodship account or session is created. Requires an exact Origin header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request received.
        default:
          $ref: '#/components/responses/Problem'
  /account/workos/password-reset:
    post:
      operationId: requestManagedPasswordReset
      description: Requests a WorkOS reset email when password login is enabled. Returns the same confirmation for missing accounts. Requires an exact Origin header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: If the account exists, a reset link was sent.
        default:
          $ref: '#/components/responses/Problem'
  /account/workos/password-reset/confirm:
    post:
      operationId: confirmManagedPasswordReset
      description: Changes the WorkOS password using a reset token. WorkOS enforces password policy and token expiry. Creates no Doodship session. Requires an exact Origin header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                  maxLength: 512
                password:
                  type: string
                  minLength: 8
                  maxLength: 4096
      responses:
        '200':
          description: Password changed. Sign in to create a session.
        default:
          $ref: '#/components/responses/Problem'
  /account/workos/start:
    post:
      operationId: startWorkOSLogin
      description: Starts AuthKit login with PKCE and a browser-bound cookie. Set link to connect an authenticated existing account. Tenant and challenge preserve a tenant handoff destination.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider:
                  type: string
                  enum: [github, google, sso]
                  description: Optional direct provider login instead of the AuthKit hosted form.
                email:
                  type: string
                  format: email
                  description: Required for direct SSO discovery.
                tenantId:
                  type: string
                codeChallenge:
                  type: string
                link:
                  type: boolean
                waitlist:
                  type: boolean
                  description: Opens the WorkOS waitlist. Cannot be combined with linking or a tenant handoff.
                invitationToken:
                  type: string
                  maxLength: 512
                  description: Invitation token received from WorkOS. Cannot be combined with linking or the waitlist.
      responses:
        '200':
          description: Authorization URL. The browser must retain the state cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
        default:
          $ref: '#/components/responses/Problem'
  /account/workos/callback:
    get:
      operationId: completeWorkOSLogin
      description: Consumes the browser-bound attempt and exchanges the authorization code on the server. Existing email addresses require explicit linking.
      security: []
      parameters:
      - in: query
        name: state
        required: true
        schema:
          type: string
      - in: query
        name: code
        schema:
          type: string
      responses:
        '303':
          description: Redirect to Dispatch with a host-only session cookie on success, or to sign-in with an error.
        default:
          $ref: '#/components/responses/Problem'
  /tenants/{id}/join-requests:
    get:
      operationId: listTenantJoinRequests
      description: Tenant owner only. Lists up to 100 explicit join requests and new provider users
        awaiting approval. Approve through the existing member creation endpoint. Removed members are excluded.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pending users.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    email:
                      type: string
                    name:
                      type: string
        default:
          $ref: '#/components/responses/Problem'
  /account/login:
    post:
      operationId: hostedLogin
      description: Root host only. Creates the secure HttpOnly host-only platform cookie. Credentials
        are never returned in JSON.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                password:
                  type: string
                  format: password
              required:
              - email
              - password
      security: []
  /account/register:
    post:
      operationId: registerHostedAccount
      description: Root host only. Public registration is closed by default. Sends a recipient
        verification link only when DISPATCH_HOSTED_ALLOW_REGISTRATION is true and SMTP is configured.
        No password is accepted before email verification. Repeating the request can resend an expired
        link.
      responses:
        '202':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                name: *id001
              required:
              - email
              - name
      security: []
  /account/verify-email:
    post:
      operationId: verifyHostedAccount
      description: Consumes the emailed token, sets the recipient-selected first password, and creates
        a platform session cookie. Omitting name keeps the name supplied during registration.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: *id001
                name: *id001
                password:
                  type: string
                  format: password
                  description: The UTF-8 encoded password must contain 12 to 72 bytes.
                  maxLength: 72
              required:
              - token
              - password
      security: []
  /account:
    get:
      operationId: hostedAccount
      description: Root host only. Returns the current global account.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /account/logout:
    post:
      operationId: logoutHostedAccount
      description: Revokes the current platform session and clears its cookie.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
  /account/password:
    put:
      operationId: changeHostedPassword
      description: Checks the old password, changes it, and revokes all existing account sessions and
        handoffs.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  description: The UTF-8 encoded password must contain 12 to 72 bytes.
                  maxLength: 72
              required:
              - oldPassword
              - newPassword
  /account/tenants:
    get:
      operationId: myHostedTenants
      description: Returns only this account's active memberships, recipient-matched invitations,
        and its pending requests to join tenants.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant:
                          $ref: '#/components/schemas/Tenant'
                        role: &id002
                          type: string
                          enum:
                          - owner
                          - admin
                          - member
                        url: *id001
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  joinRequests:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createOwnHostedTenant
      description: Creates a tenant owned by the signed-in, active, verified account. Creates the
        WorkOS organization before returning when WorkOS is available. An outage leaves the
        tenant pending for automatic retry. Does not grant platform administrator access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
                name:
                  type: string
                  maxLength: 120
      responses:
        '202':
          description: Tenant saved. Provisioning continues in the background.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
  /account/join-requests:
    post:
      operationId: requestHostedTenantMembership
      description: Records the signed-in account's request to join an active tenant. Repeating a
        request is safe. Only the tenant owner can approve it through the members API. A request
        does not grant membership, and removed members cannot request access again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug]
              properties:
                slug:
                  type: string
      responses:
        '202':
          description: Waiting for tenant owner approval.
        default:
          $ref: '#/components/responses/Problem'
  /account/invitations/{id}/accept:
    post:
      operationId: acceptHostedInvitation
      description: Accepts an invitation only for its active verified email recipient. The platform role
        does not override this check.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
  /account/handoffs:
    post:
      operationId: createTenantHandoff
      description: Root host only. Requires current membership. Returns a server-derived tenant callback
        URL containing a one-use code in its fragment. The S256 challenge came from the tenant auth/start
        route.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: *id001
                required:
                - url
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId: *id001
                codeChallenge: *id001
              required:
              - tenantId
              - codeChallenge
  /hosted/auth/start:
    get:
      operationId: startTenantLogin
      description: Tenant console only. Sets a secure HttpOnly PKCE verifier cookie and redirects to the
        root login host with tenant and challenge parameters.
      responses:
        '303':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /hosted/auth/exchange:
    post:
      operationId: exchangeTenantLogin
      description: Tenant console only. Requires the verifier cookie and a matching one-minute handoff
        code. Sets a secure host-only tenant cookie and clears the verifier.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: *id001
              required:
              - code
      security: []
  /hosted/auth/logout:
    post:
      operationId: logoutTenant
      description: Revokes only this tenant session and clears its cookie.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      security: &id003
      - tenantSession: []
      - bearerSession: []
  /platform/tenants:
    get:
      operationId: listHostedTenants
      description: Platform administrator only. Metadata only; this does not open tenant operational databases.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createHostedTenant
      description: Platform administrator only. Creates a pending tenant with an explicit verified owner
        or recipient-bound email invitation. Does not enroll the creator. Provisioning retries in the
        background.
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug: *id001
                name: *id001
                ownerEmail: *id001
              required:
              - slug
              - name
              - ownerEmail
  /platform/tenants/{id}:
    get:
      operationId: getHostedTenant
      description: Platform administrator only. No post-creation mutation methods exist.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
  /platform/tenants/{id}/usage:
    get:
      operationId: getHostedTenantUsage
      description: Platform administrator only. Daily aggregate buckets. Current-day data is partial.
        Only fields named in measured are measurements; unavailable metrics are not measured zero.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
      - in: query
        name: days
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
  /tenants/{id}/members:
    get:
      operationId: listTenantMembers
      description: Root host only. Requires owner or admin membership in this tenant; a platform administrator
        without membership is denied.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
    post:
      operationId: addTenantMember
      description: Root host only. Tenant owner only. The email must identify an existing active verified
        account.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                role: *id002
              required:
              - email
              - role
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
  /tenants/{id}/members/{userId}:
    put:
      operationId: changeTenantMember
      description: Tenant owner only. Changes invalidate existing tenant sessions. The last active owner
        cannot be removed or demoted.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: *id002
                state:
                  type: string
                  enum:
                  - active
                  - disabled
              required:
              - role
              - state
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
      - in: path
        name: userId
        required: true
        schema: *id001
    delete:
      operationId: removeTenantMember
      description: Tenant owner only. Revokes membership and its sessions. Re-adding the user cannot revive
        old credentials.
      responses:
        '204':
          description: Success.
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
      - in: path
        name: userId
        required: true
        schema: *id001
components:
  securitySchemes:
    installationGrant:
      type: http
      scheme: bearer
      description: The self-hosted installation grant. It cannot act as a user session.
    platformSession:
      type: apiKey
      in: cookie
      name: __Host-dispatch-platform
    tenantSession:
      type: apiKey
      in: cookie
      name: __Host-dispatch-tenant
    bearerSession:
      type: http
      scheme: bearer
      description: An audience-bound user session, not a legacy installation admin token.
  responses:
    Problem:
      description: Request rejected or service unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    User:
      type: object
      properties:
        id: *id001
        email: *id001
        name: *id001
        state: *id001
        platformAdmin:
          type: boolean
        emailVerified:
          type: boolean
        workosLinked:
          type: boolean
          description: Whether this account has a connected WorkOS identity. Returned by the account endpoint.
        createdAt: &id004
          type: string
          format: date-time
      required:
      - id
      - email
      - name
      - platformAdmin
    Tenant:
      type: object
      properties:
        id: *id001
        slug: *id001
        name: *id001
        state:
          type: string
          enum:
          - pending
          - provisioning
          - active
          - failed
        createdAt: *id004
      required:
      - id
      - slug
      - name
      - state
      - createdAt
    Member:
      type: object
      properties:
        tenantId: *id001
        userId: *id001
        role: *id002
        state:
          type: string
          enum:
          - active
          - disabled
        createdAt: *id004
        user:
          type: object
          properties:
            id: *id001
            email: *id001
            name: *id001
          required:
          - id
          - email
          - name
    Usage:
      type: object
      properties:
        tenantId: *id001
        periodStart: *id004
        periodEnd: *id004
        updatedAt: *id004
        measured:
          type: array
          items:
            type: string
            enum:
            - projects
            - applications
            - members
            - builds
            - deployments
            - buildSeconds
            - runtimeSeconds
            - storageBytes
            - transferBytes
        projects:
          type: integer
          format: int64
          minimum: 0
          description: Current project count at collection time. Do not sum across daily buckets.
        applications:
          type: integer
          format: int64
          minimum: 0
          description: Current non-closed application count at collection time, excluding templates.
        members:
          type: integer
          format: int64
          minimum: 0
          description: Current active membership count at collection time. Do not sum across daily buckets.
        builds:
          type: integer
          format: int64
          minimum: 0
        deployments:
          type: integer
          format: int64
          minimum: 0
        buildSeconds:
          type: integer
          format: int64
          minimum: 0
        runtimeSeconds:
          type: integer
          format: int64
          minimum: 0
        storageBytes:
          type: integer
          format: int64
          minimum: 0
        transferBytes:
          type: integer
          format: int64
          minimum: 0
    Problem:
      type: object
      properties:
        status:
          type: integer
        title: *id001
        detail: *id001
      required:
      - status
      - title
      - detail
